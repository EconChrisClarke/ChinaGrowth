     are different widths, so a fixed control width would sit under the canvas
     edge in one frame and past it in another. */
  const ctl = document.getElementById('controls');
  if(ctl) ctl.style.width = Math.round(P.w * k) + 'px';
}

function setMode(m){
  if(!PRESETS[m]) return;
  MODE = m;
  document.querySelectorAll('#bar button[data-m]').forEach(b =>
    b.classList.toggle('on', b.dataset.m === MODE));
  render();
}

/* type:'panels' hover — one thin shared crosshair down the whole stack, a
   coloured dot on each panel's line at that x, and the value set right next
   to its own dot. Deliberately not a tooltip box: an opaque panel is exactly
   what a reader doesn't want when it lands over the top of the stack, which
   a box tall enough for four lines of text does on a short chart. Halo-
   outlined text (a stroke in the background colour under the fill) keeps
   each value readable over the gridlines and the line it's reporting on,
   without needing a background shape to sit on. */
function panelsTooltip(e){
  if(!PANEL_GEOM) return;
  const r = cv.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  const k = curW / r.width;
  const mx = (cx-r.left)*k, my = (cy-r.top)*k;
  render();
  if(mx < PANEL_GEOM.pL-30 || mx > PANEL_GEOM.pR+30) return;

  let best=null, bd=1e9;
  HIT.forEach(h=>{ const d=Math.abs(h.x-mx); if(d<bd){ bd=d; best=h; } });
  if(!best || bd > 60) return;
  const targetX = best.x;
  const rows = PANEL_GEOM.rows;
  const s = PRESETS[MODE].s;

  const perPanel = [];
  for(let i=0;i<rows.length;i++){
    let pbest=null, pbd=1e9;
    HIT.forEach(h=>{ if(h.panel===i){ const d=Math.abs(h.x-targetX); if(d<pbd){ pbd=d; pbest=h; } } });
    if(pbest) perPanel.push(pbest);
  }
  if(!perPanel.length) return;

  ctx.save();
  ctx.strokeStyle = T.grid; ctx.lineWidth = Math.max(1, s*0.85);
  ctx.beginPath();
  ctx.moveTo(targetX, rows[0].pT); ctx.lineTo(targetX, rows[rows.length-1].pB);
  ctx.stroke();

  function haloText(text, x, y, align, weight, sz, color){
    ctx.font = weight + ' ' + sz + 'px ' + T.fBody;
    ctx.textAlign = align;
    ctx.lineJoin = 'round'; ctx.lineWidth = 3.2*s; ctx.strokeStyle = T.bg;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  perPanel.forEach(h=>{
    ctx.fillStyle = h.color;
    ctx.beginPath(); ctx.arc(h.x,h.y,T.dotR*s*1.05,0,6.284); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2*s;
    ctx.beginPath(); ctx.arc(h.x,h.y,T.dotR*s*1.05,0,6.284); ctx.stroke();

    /* Flip to the left of the dot when it's sitting in the right margin, so
       the value never runs off the canvas edge on the last few points. */
    const goLeft = h.x > PANEL_GEOM.pR - 90*s;
    const tx = h.x + (goLeft ? -1 : 1) * T.dotR*s*2.0;
    haloText(fmtWith(h.v, (CHART.panels[h.panel].format)||{}), tx,
             h.y + T.szAxis*s*0.32, goLeft ? 'right' : 'left',
             '700', T.szAxis*s, T.ink);
  });

  const xlab = xlabel(xval(perPanel[0].cat), 0);
  let align = 'center', lx = targetX;
  if(targetX < PANEL_GEOM.pL + 46*s){ align = 'left'; lx = PANEL_GEOM.pL; }
  else if(targetX > PANEL_GEOM.pR - 46*s){ align = 'right'; lx = PANEL_GEOM.pR; }
  haloText(xlab, lx, rows[rows.length-1].pB + T.szAxis*s*1.05,
           align, '600', T.szAxis*s, T.muted);

  ctx.textAlign = 'left';
  ctx.restore();
}

function tooltip(e){
  if(!geom) return;
  if(CHART.type === 'panels') return panelsTooltip(e);
  const r = cv.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  const k = curW / r.width;
  const mx = (cx-r.left)*k, my = (cy-r.top)*k;
  let best=null, bd=1e9;
  HIT.forEach(h=>{ const d=Math.hypot(h.x-mx,(h.y-my)*0.55); if(d<bd){bd=d;best=h;} });
  render();
  if(!best || bd > 70) return;
  const s = PRESETS[MODE].s;
  ctx.save();
  ctx.strokeStyle=T.grid; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(best.x,geom.pT); ctx.lineTo(best.x,geom.pB); ctx.stroke();
  ctx.fillStyle=best.color;
  ctx.beginPath(); ctx.arc(best.x,best.y,T.dotR*s*1.15,0,6.284); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2*s;
  ctx.beginPath(); ctx.arc(best.x,best.y,T.dotR*s*1.15,0,6.284); ctx.stroke();
  let lbl;
  if(CHART.type==='column' || CHART.type==='bar'){
    lbl = best.cat + '   ' + fmt(best.v);
  } else if(CHART.type==='scatter'){
    const nx = CHART.xFormat ? xfmt(best.xv) : (Math.round(best.xv*100)/100);
    lbl = (best.pt ? best.pt + '   ' : '') + nx + ', ' + fmt(best.v);
  } else {
    lbl = xlabel(xval(best.cat), 0) + '   ' + fmt(best.v);
  }
  ctx.font='600 ' + (T.szLabel*s) + 'px ' + T.fBody;
  const bw = ctx.measureText(lbl).width + 16*s, bh = T.szLabel*s*2.1;
  const bx = Math.min(Math.max(best.x-bw/2, geom.pL), geom.pR-bw);
  let by = best.y - bh - 12*s; if(by < geom.pT) by = best.y + 12*s;
  ctx.fillStyle='rgba(17,24,39,.93)';
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,5*s); ctx.fill();
  ctx.fillStyle='#fff'; ctx.textAlign='left';
  ctx.fillText(lbl, bx+8*s, by+bh*0.65);
  ctx.restore();
}

function slug(t){ return String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60); }

function download(name){
  const P = PRESETS[name || MODE];
  name = name || MODE;
  const off = document.createElement('canvas');
  off.width = P.w*P.ex; off.height = P.h*P.ex;
  const c = off.getContext('2d');
  c.setTransform(P.ex,0,0,P.ex,0,0);
  draw(c, P.w, P.h, P, {logoImg:logoImg});
  const a = document.createElement('a');
  a.download = slug(CHART.headline)+'-'+name+'.png';
  a.href = off.toDataURL('image/png');
  a.click();
  render();
}

function srTable(){
  const rows = [];
  if(CHART.type==='column'||CHART.type==='bar'){
    const S = activeSeries();
    rows.push('<tr><th>Category</th>'+S.map(s=>'<th>'+s.name+'</th>').join('')+'</tr>');
    categoryOrder().forEach(i=>
      rows.push('<tr><th>'+CHART.categories[i]+'</th>'+S.map(s=>'<td>'+fmt(+s.data[i])+'</td>').join('')+'</tr>'));
  } else if(CHART.type==='panels'){
    (CHART.panels||[]).forEach(p=>{
      rows.push('<tr><th colspan="2">'+p.label+'</th></tr>');
      p.data.forEach(d=>rows.push('<tr><td>'+d[0]+'</td><td>'+fmtWith(d[1], p.format||{})+'</td></tr>'));
    });
  } else {
    CHART.series.forEach(s=>{
      rows.push('<tr><th colspan="2">'+s.name+'</th></tr>');
      s.data.forEach(d=>rows.push('<tr><td>'+d[0]+'</td><td>'+fmt(d[1])+'</td></tr>'));
    });
  }
  document.getElementById('srtable').innerHTML =
    '<caption>'+CHART.headline+'. '+CHART.subhead+'</caption>'+rows.join('');
  cv.setAttribute('role','img');
  cv.setAttribute('aria-label', CHART.headline+'. '+CHART.subhead+'. Full data in the table that follows.');
}

/* The note and source as selectable DOM text. The canvas copy is what the PNG
   carries; this is the one you can drag-select and paste. */
function copyText(){
  const el = document.getElementById('copytext');
  if(!el) return;
  const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const out = [];
  out.push('<p class="ct-head">' + esc(CHART.headline) + '</p>');
  if(subheadText()) out.push('<p>' + esc(subheadText()) + '</p>');
  if(CHART.note) out.push('<p>' + esc(CHART.note) + '</p>');
  const src = [];
  if(CHART.source) src.push('Source: ' + esc(CHART.source));
  if(CHART.sourceUrl) src.push('<a href="' + esc(CHART.sourceUrl) + '">'
                               + esc(CHART.sourceUrl) + '</a>');
  if(src.length) out.push('<p class="src">' + src.join(' &middot; ') + '</p>');
  el.innerHTML = out.join('');
}

/* --------------------------------------------------------------------------
   Range control. Zooming a time series is an editorial decision — the same
   data says different things over 1984-2024 and over 2019-2024 — so it belongs
   in the chart rather than in a re-run. Whatever window is showing is what the
   PNG exports, and the control prints the matching `xRange` line so a chosen
   window can be pinned into the config permanently.
   ----------------------------------------------------------------------- */
function buildZoom(){
  const z = document.getElementById('zoom');
  if(!z) return;
  if(CHART.type==='column' || CHART.type==='bar'){ z.innerHTML = ''; return; }

  const scatter = CHART.type==='scatter';
  if(scatter && !hasRangeKeys()){ z.innerHTML=''; return; }

  /* On a scatter the options are the years the points come from, so the control
     reads "2000 to 2026" rather than a list of unemployment rates. */
  const seen = [], key = {};
  seriesLike().forEach(se => se.data.forEach(d=>{
    const raw = scatter ? String(d[2]).slice(0,4) : d[0];
    const k = String(raw);
    if(!key[k]){ key[k]=1; seen.push(raw); }
  }));
  const ord = v => scatter ? +v : xval(v);
  seen.sort((a,b)=>ord(a)-ord(b));
  if(seen.length < 4){ z.innerHTML=''; return; }

  const cur = [seen[0], seen[seen.length-1]];
  const lab = v => scatter ? String(v) : xlabel(xval(v), 0);

  const opts = sel => seen.map(v =>
    '<option value="'+v+'"'+(String(v)===String(sel)?' selected':'')+'>'
    + lab(v) + '</option>').join('');

  z.innerHTML = '<span class="ctllab">Range</span>'
    + '<select id="zfrom">'+opts(cur[0])+'</select>'
    + '<span class="to">to</span>'
    + '<select id="zto">'+opts(cur[1])+'</select>'
    + '<button id="zreset">Full range</button>';

  const from = document.getElementById('zfrom'), to = document.getElementById('zto');

  function apply(){
    let a = from.value, b = to.value;
    if(ord(a) >= ord(b)){                       // keep at least two points visible
      const ia = seen.findIndex(v=>String(v)===String(a));
      b = seen[Math.min(ia+1, seen.length-1)];
      to.value = b;
    }
    const full = String(a)===String(seen[0]) && String(b)===String(seen[seen.length-1]);
    if(full){ VIEW = null; }
    else if(scatter){
      VIEW = [ Date.UTC(+a,0,1), Date.UTC(+b,11,31) ];
    } else {
      VIEW = [xval(a), xval(b)];
    }
    render();
  }
  from.addEventListener('change', apply);
  to.addEventListener('change', apply);
  document.getElementById('zreset').addEventListener('click', function(){
    from.value = seen[0]; to.value = seen[seen.length-1]; apply();
  });
  apply();
}

/* --------------------------------------------------------------------------
   Axis controls.

   A numeric axis gets a scale dropdown. A time axis does not — log years are
   meaningless — so it gets smoothing instead, which is the transformation that
   actually matters on a time series: it is how you separate a trend from the
   noise around it.
   ----------------------------------------------------------------------- */
function xIsTime(){ return CHART.xType === 'year' || CHART.xType === 'date'; }

const SCALE_LABELS = [['Linear','linear'], ['Log (base 10)','log'], ['Square root','sqrt']];

function buildAxes(){
  const z = document.getElementById('axes');
  if(!z) return;
  if(CHART.type === 'column' || CHART.type === 'bar' || CHART.type === 'panels'){ z.innerHTML = ''; return; }

  const sel = (id, opts, cur) =>
    '<select id="'+id+'">' + opts.map(o =>
      '<option value="'+o[1]+'"'+(String(o[1])===String(cur)?' selected':'')+'>'+o[0]+'</option>'
    ).join('') + '</select>';

  const parts = [];
  const smooth = xIsTime() ? smoothOptions() : [];

  /* The first control in the row takes the shared label column so it lines up
     under Range and View; anything after it is inline. */
  if(xIsTime()){
    if(smooth.length)
      parts.push('<span class="ctllab">Smoothing</span>' +
        sel('axsm', [['Regular',1]].concat(smooth.map(o => [o[0], o[1]])), SMOOTH));
  } else {
    parts.push('<span class="ctllab">X scale</span>' + sel('axsx', SCALE_LABELS, SX));
  }
  const yLab = parts.length ? '<span class="ctllab inline">Y scale</span>'
                            : '<span class="ctllab">Y scale</span>';
  parts.push(yLab + sel('axsy', SCALE_LABELS, SY));
  parts.push('<span class="ctlwarn" id="axwarn"></span>');

  z.innerHTML = parts.join('');

  const warn = document.getElementById('axwarn');
  /* A log axis on a series containing a zero throws rather than dropping the
     point. Catch it here, put the control back, and say why — the alternative
     is a blank chart with no explanation. */
  function attempt(apply, undo){
    warn.textContent = '';
    apply();
    try { render(); }
    catch(err){ undo(); render(); warn.textContent = String(err.message || err); }
  }
  const sy = document.getElementById('axsy');
  if(sy) sy.addEventListener('change', function(){
    const prev = SY;
    attempt(()=>{ SY = sy.value; }, ()=>{ SY = prev; sy.value = prev; });
  });
  const sx = document.getElementById('axsx');
  if(sx) sx.addEventListener('change', function(){
    const prev = SX;
    attempt(()=>{ SX = sx.value; }, ()=>{ SX = prev; sx.value = prev; });
  });
  const sm = document.getElementById('axsm');
  if(sm) sm.addEventListener('change', function(){
    SMOOTH = +sm.value || 1;
    const hit = smooth.filter(o => o[1] === SMOOTH)[0];
    SMOOTH_LABEL = hit ? hit[0] : '';
    render();
  });
}

/* --------------------------------------------------------------------------
   Series filter UI. See the CHART.stacked comment in the config block and the
   categoryOrder() doc comment above for what checking/unchecking actually
   does to the layout. This function only builds the checkboxes and wires
   their state into SERIES_ON; drawHBars / the column marks loop / the legend
   (via activeSeries()) do the rest on the next render().
   ----------------------------------------------------------------------- */
function buildSeriesFilter(){
  const z = document.getElementById('seriesFilter');
  if(!z) return;
  const isCat = CHART.type==='column' || CHART.type==='bar';
  if(!isCat || CHART.series.length < 2){ z.innerHTML=''; return; }

  if(!SERIES_ON) SERIES_ON = new Set(CHART.series.map(se=>se.name));

  z.innerHTML = '<span class="ctllab">Show</span>' + CHART.series.map((se,i)=>{
    const col = seriesColor(i,se);
    const checked = SERIES_ON.has(se.name) ? ' checked' : '';
    return '<label class="cbx"><input type="checkbox" id="sf'+i+'"'+checked+'>'
      + '<span class="dot" style="background:'+col+'"></span>'
      + '<span class="cbxname">'+se.name+'</span></label>';
  }).join('');

  CHART.series.forEach((se,i)=>{
    const el = document.getElementById('sf'+i);
    el.addEventListener('change', function(){
      /* At least one series must stay checked — there is no "show nothing"
         state worth explaining, so the click that would produce one is
         simply refused and the box springs back on. */
      if(!el.checked && SERIES_ON.size <= 1 && SERIES_ON.has(se.name)){
        el.checked = true;
        return;
      }
      if(el.checked) SERIES_ON.add(se.name); else SERIES_ON.delete(se.name);
      render();
    });
  });
}

if(new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
document.querySelectorAll('#bar button[data-m]').forEach(b=>
  b.addEventListener('click', function(){ setMode(b.dataset.m); }));
document.getElementById('dl').addEventListener('click', function(){ download(); });

/* --------------------------------------------------------------------------
   Copying.

   Canvas text is pixels, not text — there is no DOM node to select, so it
   cannot be dragged over or copied the way HTML can. Rather than pretend
   otherwise, the same strings are offered explicitly: the chart's words as
   plain text, and the underlying numbers as TSV that pastes into a spreadsheet.
   ----------------------------------------------------------------------- */
function chartText(){
  const out = [];
  if(CHART.headline) out.push(CHART.headline);
  if(subheadText()) out.push(subheadText());
  if(CHART.note) out.push('', CHART.note);
  const src = [];
  if(CHART.source) src.push('Source: ' + CHART.source);
  if(CHART.sourceUrl) src.push(CHART.sourceUrl);
  if(src.length) out.push('', src.join('  ·  '));
  return out.join('\n');
}

/* TSV, because that is what pastes into Excel and Google Sheets as columns.
   The visible series are used, so a zoomed or smoothed chart copies the
   numbers actually on screen rather than the untouched originals. */
function chartData(){
  const rows = [];
  if(CHART.type==='column' || CHART.type==='bar'){
    const S = activeSeries();
    rows.push(['Category'].concat(S.map(s=>s.name||'Value')).join('\t'));
    categoryOrder().forEach(i=>
      rows.push([CHART.categories[i]].concat(S.map(s=>s.data[i])).join('\t')));
  } else if(CHART.type==='panels'){
    const Ps = CHART.panels || [];
    const xlab = CHART.xLabel || (CHART.xType==='date' ? 'Date' : 'X');
    rows.push([xlab].concat(Ps.map(p=>p.label)).join('\t'));
    const n = Ps.length ? Ps[0].data.length : 0;
    for(let i=0;i<n;i++)
      rows.push([Ps[0].data[i][0]].concat(Ps.map(p=>p.data[i][1])).join('\t'));
  } else {
    const S = activeSeries();
    const xlab = CHART.xLabel || (CHART.xType==='date' ? 'Date' : 'X');
    if(CHART.type==='scatter'){
      rows.push([xlab, CHART.yLabel||'Y', 'Label', 'Series'].join('\t'));
      S.forEach(se=>se.data.forEach(d=>
        rows.push([d[0], d[1], (d.length>2?d[2]:''), se.name||''].join('\t'))));
    } else {
      rows.push([xlab].concat(S.map(s=>s.name||'Value')).join('\t'));
      const keys = [];
      S.forEach(se=>se.data.forEach(d=>{ if(keys.indexOf(String(d[0]))<0) keys.push(String(d[0])); }));
      keys.sort((a,b)=>xval(a)-xval(b));
      keys.forEach(k=>{
        const cells = S.map(se=>{
          const hit = se.data.filter(d=>String(d[0])===k)[0];
          return hit ? hit[1] : '';
        });
        rows.push([k].concat(cells).join('\t'));
      });
    }
  }
  return rows.join('\n');
}

/* Charts get opened straight off disk, where file:// is not a secure context
   and the async clipboard API is unavailable. The textarea fallback is not
   legacy cruft — it is the path that actually runs most of the time. */
function copyToClipboard(text, said){
  const done = () => {
    const el = document.getElementById('cpsaid');
    if(el){ el.textContent = said; setTimeout(()=>{ el.textContent=''; }, 2200); }
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, ()=>fallback(text, done));
  } else fallback(text, done);
}
function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); }
  catch(e){
    const el = document.getElementById('cpsaid');
    if(el) el.textContent = 'Could not copy — select the text below the chart instead';
  }
  document.body.removeChild(ta);
}
document.getElementById('cptext').addEventListener('click', function(){
  copyToClipboard(chartText(), 'Chart text copied');
});
document.getElementById('cpdata').addEventListener('click', function(){
  copyToClipboard(chartData(), 'Data copied as columns — paste into a spreadsheet');
});
/* Click a mark to toggle emphasis. Highlighting is an editorial choice made by
   eye — which bar makes the point is usually obvious only once the chart is
   drawn — so it belongs here rather than requiring a rebuild. The exports read
   the same state, so what's on screen is what downloads. */
function toggleHi(e){
  if(CHART.type === 'panels') return;   // no highlight state wired up for panels yet
  const r = cv.getBoundingClientRect();
  const k = curW / r.width;
  const mx = (e.clientX-r.left)*k, my = (e.clientY-r.top)*k;
  /* Legend first: the items sit outside the plot, so there is no ambiguity,
     and a click there should always mean "isolate this series". */
  const onLegend = LEGHIT.filter(l =>
    mx >= l.x0 && mx <= l.x1 && my >= l.y0 && my <= l.y1)[0];
  if(onLegend){ toggleKey(onLegend.key); return; }

  let best = null, bd = 1e9;
  HIT.forEach(h=>{
    const hx = h.cx===undefined ? h.x : h.cx;
    const hy = h.cy===undefined ? h.y : h.cy;
    const d = Math.hypot(hx-mx, hy-my);
    if(d < bd){ bd = d; best = h; }
  });
  if(!best || best.key===undefined || bd > 90) return;
  toggleKey(best.key);
}

/* One series in, one series out. Clicking an already-highlighted item clears
   it, so there is always a way back to the neutral chart without a reset
   button to explain. */
function toggleKey(key){
  if(!HILITE) HILITE = [];
  const i = HILITE.indexOf(key);
  if(i >= 0) HILITE.splice(i,1); else HILITE.push(key);
  if(!HILITE.length) HILITE = null;
  render();
}
cv.addEventListener('click', toggleHi);
cv.addEventListener('mousemove', tooltip);
cv.addEventListener('touchstart', tooltip, {passive:true});
cv.addEventListener('touchmove', tooltip, {passive:true});
cv.addEventListener('mouseleave', render);
window.addEventListener('resize', render);

function boot(){
  /* A tinted canvas has to tint everything derived from it — the shaded bands
     and the halo behind annotation text are both painted in the background
     colour, and leaving them white would print pale rectangles on the chart. */
  if(CHART.background){
    T.bg = CHART.background;
    T.band = mix(T.bg, '#111827', 0.055);
    T.grid = mix(T.bg, '#111827', 0.115);
    T.zero = mix(T.bg, '#111827', 0.24);
    document.documentElement.style.background = T.bg;
    document.body.style.background = T.bg;
  }
  srTable();
  copyText();
  const h = CHART.highlight;
  HILITE = (h===null || h===undefined || h==='') ? null
         : (Array.isArray(h) ? h.slice() : [h]);
  if(CHART.xRange && CHART.xRange.length===2)
    VIEW = [xval(CHART.xRange[0]), xval(CHART.xRange[1])];
  cv.style.cursor = 'pointer';
  SX = CHART.xScale || 'linear';
  SY = CHART.yScale || 'linear';
  buildZoom();
  buildAxes();
  buildSeriesFilter();
  if(typeof CHART.logo === 'string' && CHART.logo){
    logoImg = new Image();
    logoImg.onload = render;
    logoImg.onerror = function(){ logoImg=null; render(); };
    logoImg.src = CHART.logo;
  } else render();
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(boot);
setTimeout(function(){ if(!geom) boot(); }, 1500);
</script>
