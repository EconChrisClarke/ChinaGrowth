<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>With exchange rate dollars, US economy is bigger. With PPP adjusted dollars, China is</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@144,700&family=Inter:wght@400;500;600;700&family=Jost:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#111827; --muted:#6B7280; --grid:#E4D8DB; --red:#C71E1D; --bg:#FFF1F2; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  #stage{margin:0 auto;padding:8px;text-align:center}
  /* The canvas is a real export frame — 1456x900, 1080x1920 or 1080x1080 —
     scaled to fit the viewport. What is on screen is the PNG, at every size. */
  canvas{display:inline-block;max-width:100%;height:auto;touch-action:pan-y;
    box-shadow:0 1px 3px rgba(17,24,39,.10)}
  /* Controls sit in a single column whose width is set to the rendered canvas,
     so nothing is centred independently. Labels share a fixed first column and
     Download is pushed to the right edge — everything is flush left or flush
     right, nothing floats in between. */
  #controls{margin:14px auto 30px;padding:0 8px;box-sizing:border-box;text-align:left}
  .ctlrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px}
  .ctlrow:empty{display:none;margin:0}
  #bar{margin-bottom:0}
  .ctllab{flex:0 0 84px;font:500 11.5px/1.4 'Inter',sans-serif;color:#9CA3AF;
    letter-spacing:.06em;text-transform:uppercase}
  .ctllab.inline{flex:0 0 auto;margin-left:16px}
  .ctlrow button,.ctlrow select{font:600 12.5px/1 'Inter',system-ui,sans-serif;
    color:#374151;background:transparent;border:1px solid #D9C7CB;border-radius:7px;
    padding:8px 11px;cursor:pointer}
  .ctlrow select{padding:7px 8px}
  .ctlrow button:hover{border-color:var(--red);color:var(--red)}
  #bar button.on{border-color:var(--red);color:#fff;background:var(--red)}
  #bar button.dl{margin-left:auto;border-color:#B9A6AA;font-weight:700}
  #bar button.dl:hover{background:var(--red);border-color:var(--red);color:#fff}
  .ctlwarn{flex:1 0 100%;font:500 11.5px/1.4 'Inter',sans-serif;color:var(--red);
    margin-left:84px}
  /* Series-filter checkboxes (column/bar charts with 2+ series). Styled as
     small pills to match the button language used elsewhere in this row,
     rather than bare OS checkboxes, which would be the only native-chrome
     element in an otherwise fully custom control bar. */
  .ctlrow label.cbx{display:inline-flex;align-items:center;gap:6px;
    font:600 12.5px/1 'Inter',system-ui,sans-serif;color:#374151;cursor:pointer;
    padding:7px 11px 7px 9px;border:1px solid #D9C7CB;border-radius:7px;
    background:transparent;user-select:none}
  .ctlrow label.cbx:hover{border-color:var(--red)}
  .ctlrow label.cbx input[type=checkbox]{appearance:none;-webkit-appearance:none;
    width:14px;height:14px;border:1.5px solid #B9A6AA;border-radius:4px;margin:0;
    position:relative;cursor:pointer;flex:0 0 auto}
  .ctlrow label.cbx input[type=checkbox]:checked{border-color:var(--red);background:var(--red)}
  .ctlrow label.cbx input[type=checkbox]:checked::after{content:'';position:absolute;
    left:3px;top:-1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;
    transform:rotate(45deg)}
  .ctlrow label.cbx .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .ctlrow label.cbx .cbxname{white-space:nowrap}
  #copytext{margin-top:14px;font:400 12px/1.55 'Inter',sans-serif;color:#767C86}
  #copytext p{margin:0 0 4px}
  #copytext .ct-head{color:#111827;font-weight:600}
  #copytext a{color:#767C86}
  body.embed #controls{display:none}
  table.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<div id="stage"><canvas id="cv"></canvas></div>

<!-- One control column, width-matched to the canvas in render(), so every
     label starts on the chart's left edge and Download ends on its right. -->
<div id="controls">
  <div class="ctlrow" id="zoom"></div>
  <div class="ctlrow" id="axes"></div>
  <div class="ctlrow" id="copyrow">
    <span class="ctllab">Copy</span>
    <button id="cptext">Chart text</button>
    <button id="cpdata">Data table</button>
    <span class="ctlwarn" id="cpsaid"></span>
  </div>
  <div class="ctlrow" id="seriesFilter"></div>
  <div class="ctlrow" id="bar">
    <span class="ctllab">View</span>
    <button data-m="substack">Substack 1456</button>
    <button data-m="vertical">Vertical 9:16</button>
    <button data-m="square">Square 1:1</button>
    <button id="dl" class="dl">Download PNG</button>
  </div>
  <div id="copytext"></div>
</div>

<table class="sr" id="srtable"></table>

<script>
/* ============================================================================
   CHART CONFIG — the only block you normally edit.
   ========================================================================= */
/* CHART_CONFIG_START */
const CHART = {
  "type": "column",
  "headline": "With exchange rate dollars, US economy is bigger. With PPP adjusted dollars, China is",
  "subhead": "GDP in 2025, trillions of US dollars (exchange rate) and international dollars (PPP)",
  "source": "World Bank, World Development Indicators (NY.GDP.MKTP.CD; NY.GDP.MKTP.PP.CD)",
  "sourceUrl": "https://data.worldbank.org/indicator/NY.GDP.MKTP.PP.CD?locations=CN-US",
  "note": "Exchange-rate GDP converts at market exchange rates. PPP GDP converts at purchasing power parity, adjusting for price levels; the US is the PPP base, so its two figures are identical.",
  "handle": "@EconChrisClarke",
  "xType": "category",
  "format": {
    "prefix": "$",
    "suffix": "T",
    "decimals": 1
  },
  "categories": [
    "Exchange rate",
    "PPP"
  ],
  "barNames": true,
  "valueLabels": true,
  "series": [
    {
      "name": "China",
      "data": [
        19.5,
        41.3
      ]
    },
    {
      "name": "U.S.",
      "data": [
        30.8,
        30.8
      ]
    }
  ]
};
/* CHART_CONFIG_END */

/* ============================================================================
   THEME — the house style. Edit here, never per chart.
   ========================================================================= */
const T = {
  /* The canvas is the EconChrisClarke rose, not white. Gridlines, the zero
     rule and the shaded bands are all derived from it, because a neutral grey
     grid on a warm background reads as dirty rather than as quiet. */
  bg:'#FFF1F2', ink:'#111827', muted:'#6B7280', faint:'#767C86',
  grid:'#E4D8DB', zero:'#C6BDC1', band:'#F2E5E7', red:'#C71E1D',
  palette:['#C71E1D','#1B3A5C','#E8A33D','#2E8B7A','#7C4A8D','#6B7280'],
  fTitle:"'Fraunces',Georgia,'Times New Roman',serif",
  headWeight:700,
  fBody:"'Inter',system-ui,-apple-system,sans-serif",
  fLogo:"'Jost',system-ui,-apple-system,sans-serif",
  szHead:25, szSub:14.5, szAxis:13, szLabel:13.5, szFoot:11.5, szAnno:12.5,
  lineW:3.2, dotR:4.6, pad:26, gap:9
};

/* Output presets. `s` scales all type and spacing together. `safe` keeps
   content clear of platform UI (TikTok caption block, right button rail). */
/* `fs` scales the footer independently of `s`. On the 9:16 export the safe area
   already gives up 600 of 1920px to platform UI, and a footnote set at the same
   2.1x as everything else can eat another fifth of what is left — so the plot
   ends up a strip in the middle. The note still has to be legible on a phone,
   but it does not have to be as large as the axis labels.
   `pl` turns point labels on or off per output. */
/* `hs` scales the headline block, `fs` the footer — both independently of `s`.
   On 9:16 the frame is tall but the safe area takes 570 of 1920px, and at a
   uniform 2.1x the headline alone claimed 484px of the 1350 that remained. The
   plot was left as a strip. Type still has to be legible at arm's length, so
   these are trims rather than collapses.
   `pl` turns point labels on or off per output. */
/* Three outputs, not five. Portrait 4:5 and Wide 16:9 were dropped: 4:5 sat
   between Substack and Square without doing anything either could not, and 16:9
   is a slide format this chart style is not for. Fewer buttons is also fewer
   decisions at the moment of publishing. */
const PRESETS = {
  substack: { w:1456, h:900,  s:1.55, ex:2, hs:1.00, fs:1.00, pl:true,  safe:{t:0,b:0,l:0,r:0} },
  vertical: { w:1080, h:1920, s:2.00, ex:1, hs:0.78, fs:0.58, pl:false, safe:{t:150,b:380,l:30,r:110} },
  square:   { w:1080, h:1080, s:1.65, ex:1, hs:0.94, fs:0.85, pl:true,  safe:{t:16,b:16,l:16,r:16} }
};
/* Every PRESET sets these, but a hand-built P (tests, embeds) may not, so
   every reader defaults rather than assuming. */
function fscale(P){ return (P && P.fs) ? P.fs : 1; }
function hscale(P){ return (P && P.hs) ? P.hs : 1; }
function showPointLabels(P){ return !P || P.pl !== false; }

/* Footer TEXT — the note and the source — is drawn into the canvas for every
   EXPORT, because a PNG travels without the page around it and those lines are
   what keep it honest and citable.

   On the web view the canvas draws neither. Both are rendered below the chart
   as selectable DOM text instead, so each appears exactly once on screen and
   can be copied. The logo still draws, so the canvas is never unattributed. */
/* The screen and the export are now the same frame, so the canvas always
   carries the note and source. The block below the chart repeats them as
   selectable DOM text purely so they can be copied — a canvas cannot be
   drag-selected, and these are the lines most often pasted into a post. */
function showFooterText(P){ return true; }

/* ==========================================================================
   Helpers
   ======================================================================= */
const F = CHART.format || {};
/* Generalised so a type:'panels' chart can format each panel with its own
   F (eccentricity wants 3 decimals, insolation wants 0 and " W/m²") while
   every other chart type keeps calling fmt(), which just applies CHART.format. */
function fmtWith(v, FF){
  if(v===null||v===undefined||isNaN(v)) return '';
  const d = (FF.decimals===undefined||FF.decimals===null) ? 0 : FF.decimals;
  if(FF.compact){
    const a = Math.abs(v); let n=v, suf='';
    if(a>=1e12){ n=v/1e12; suf='T'; } else if(a>=1e9){ n=v/1e9; suf='B'; }
    else if(a>=1e6){ n=v/1e6; suf='M'; } else if(a>=1e3){ n=v/1e3; suf='K'; }
    if(suf) return (FF.prefix||'') + (Math.round(n*10)/10) + suf + (FF.suffix||'');
  }
  return (FF.prefix||'') + v.toLocaleString('en-US',
    {minimumFractionDigits:d, maximumFractionDigits:d}) + (FF.suffix||'');
}
function fmt(v){ return fmtWith(v, F); }

function xval(x){
  if(CHART.xType==='date') return new Date(String(x)+'T00:00:00Z').getTime();
  return +x;
}
/* A numeric x axis needs its own formatter. Population ticks that read
   "10000000" eat the plot width; "10M" does not. Falls back to the plain
   string when no xFormat is set, so existing charts are untouched. */
function xfmt(v){
  const XF = CHART.xFormat;
  if(!XF) return String(v);
  const d = (XF.decimals===undefined||XF.decimals===null) ? 0 : XF.decimals;
  let out;
  if(XF.compact){
    const a = Math.abs(v); let n=v, suf='';
    if(a>=1e12){ n=v/1e12; suf='T'; }
    else if(a>=1e9){ n=v/1e9; suf='B'; }
    else if(a>=1e6){ n=v/1e6; suf='M'; }
    else if(a>=1e3){ n=v/1e3; suf='k'; }
    const dec = (suf && Math.abs(n)<10 && n!==Math.round(n)) ? 1 : 0;
    out = n.toLocaleString('en-US',
      {minimumFractionDigits:dec, maximumFractionDigits:dec}) + suf;
  } else {
    out = (+v).toLocaleString('en-US',
      {minimumFractionDigits:d, maximumFractionDigits:d});
  }
  return (XF.prefix||'') + out + (XF.suffix||'');
}

function xlabel(raw, span){
  if(CHART.xType==='date'){
    const d = new Date(raw);
    if(span > 4*365*864e5) return String(d.getUTCFullYear());
    return d.toLocaleDateString('en-US',{month:'short',year:'2-digit',timeZone:'UTC'});
  }
  return CHART.xFormat ? xfmt(raw) : String(raw);
}

/* "Nice" ticks — steps of 1, 2, 2.5 or 5 x a power of ten. Readers parse those
   instantly; a step of 37 forces them to do arithmetic mid-scroll. */
function ticks(min,max,target){
  const span = max-min || 1;
  const raw = span/target;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw/mag;
  const step = (norm<=1?1: norm<=2?2: norm<=2.5?2.5: norm<=5?5:10) * mag;
  const out=[]; let v = Math.ceil(min/step)*step;
  for(; v<=max+step*1e-9; v+=step) out.push(+v.toFixed(10));
  return out;
}

/* Log-axis helpers.

   A log axis is snapped outward to whole decades. A reader can place a point
   between 1M and 10M by eye; between 1.37M and 8.2M they cannot, because the
   spacing is not uniform and the ends carry no round number.

   Ticks are decade boundaries. Inside two decades that leaves too few
   gridlines, so 2 and 5 are added — the same 1/2/5 progression the linear
   stepper uses, which is why they still read as "nice". */
function logSpan(min, max){
  const lo = Math.pow(10, Math.floor(Math.log10(min)));
  const hi = Math.pow(10, Math.ceil(Math.log10(max)));
  return [lo, hi === lo ? lo*10 : hi];
}
function logTicks(min, max){
  const lo = Math.round(Math.log10(min)), hi = Math.round(Math.log10(max));
  const mults = (hi - lo) <= 2 ? [1,2,5] : [1];
  const out = [];
  for(let e=lo; e<=hi; e++)
    for(const m of mults){
      const v = m * Math.pow(10, e);
      if(v >= min*0.999 && v <= max*1.001) out.push(v);
    }
  return out;
}
/* A log axis cannot show zero or negative values, and a square-root axis cannot
   show negatives. Silently dropping them would misstate the data, so fail. */
function assertDomain(vals, axis, scale){
  if(scale === 'linear') return;
  const ok = scale === 'log' ? (v => v > 0) : (v => v >= 0);
  const bad = vals.filter(v => !ok(v));
  if(bad.length){
    throw new Error(axis + ' axis: "' + scale + '" needs ' +
      (scale === 'log' ? 'positive' : 'non-negative') + ' values, but ' +
      bad.length + ' value(s) fail (e.g. ' + bad[0] + ')');
  }
}
function assertPositive(vals, axis){ assertDomain(vals, axis, 'log'); }

/* The forward transform for each scale. Square root sits between linear and
   log: it compresses a long tail without the "every gridline is ten times the
   last" reading cost, which suits counts and populations that span one or two
   orders of magnitude rather than four. */
function tfm(scale){
  if(scale === 'log')  return v => Math.log10(v);
  if(scale === 'sqrt') return v => Math.sqrt(Math.max(v, 0));
  return v => v;
}

/* Round numbers spanning a range: 1, 2, 5 x powers of ten. */
function nicePool(min, max){
  const out = [];
  const lo = Math.floor(Math.log10(Math.max(Math.abs(min) || 1e-9, 1e-9)));
  const hi = Math.ceil(Math.log10(Math.max(Math.abs(max) || 1, 1e-9)));
  for(let e = lo; e <= hi; e++)
    for(const m of [1,2,5]){
      const v = m * Math.pow(10, e);
      if(v >= min && v <= max) out.push(v);
    }
  return out;
}

/* Square-root ticks. Evenly spaced values would bunch at the top of the axis,
   so pick round numbers that land at least a sixth of the axis apart in
   transformed space. Round labels beat evenly spaced ones — a reader parses
   "500" instantly and never parses "437". */
function sqrtTicks(min, max){
  const pool = nicePool(Math.max(min, 0), max);
  if(min <= 0) pool.unshift(0);
  const t = tfm('sqrt');
  const lo = t(Math.max(min,0)), hi = t(max), span = (hi - lo) || 1;
  const out = []; let last = -Infinity;
  pool.forEach(v => {
    const pos = (t(v) - lo) / span;
    if(pos - last >= 0.16){ out.push(v); last = pos; }
  });
  return out.length >= 3 ? out : ticks(min, max, 4);
}
function scaleTicks(scale, min, max, target){
  if(scale === 'log')  return logTicks(min, max);
  if(scale === 'sqrt') return sqrtTicks(min, max);
  return ticks(min, max, target);
}

function wrap(ctx,text,maxW){
  const words = String(text).split(/\s+/); const lines=[]; let cur='';
  for(const w of words){
    const t = cur ? cur+' '+w : w;
    if(ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur=w; }
    else cur=t;
  }
  if(cur) lines.push(cur);
  return lines;
}

function seriesColor(i,s){ return s.color || T.palette[i % T.palette.length]; }

/* A series' colour has to stay fixed to its own identity, never to its
   position in whatever filtered/windowed array happens to be on screen.
   activeSeries() legitimately returns a shorter or reshuffled list — the
   series filter drops unchecked series, a zoomed/smoothed line chart
   rebuilds new series objects — and in every one of those cases the
   surviving series still needs the same colour it has in the legend and in
   the full chart, or "Critical" stops meaning red the moment "Defense" gets
   unchecked. Matched by name rather than object identity, because
   activeSeries() sometimes returns copies (smoothing/windowing), not the
   original objects. */
function origIndex(se){
  const i = CHART.series.findIndex(cs => cs.name === se.name);
  return i >= 0 ? i : 0;
}

/* --- colour maths, for emphasis ---------------------------------------- */
function hex2rgb(h){
  h = String(h).replace('#','');
  if(h.length===3) h = h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgb2hex(a){
  return '#' + a.map(v=>{
    const t = Math.max(0,Math.min(255,Math.round(v))).toString(16);
    return t.length<2 ? '0'+t : t;
  }).join('');
}
function mix(a,b,t){ const A=hex2rgb(a), B=hex2rgb(b);
  return rgb2hex([0,1,2].map(i=>A[i]+(B[i]-A[i])*t)); }
function darken(c,t){ return mix(c,'#000000',t); }
function lighten(c,t){ return mix(c,'#FFFFFF',t); }

/* Emphasis. `highlight` names the marks that carry the argument — a category
   name or index for bars, a series name for lines. The chosen mark darkens and
   the rest wash out rather than disappear, so the comparison survives: a reader
   still sees what the highlighted bar is bigger *than*. Returns null when no
   highlighting is in play, so the plain palette is used untouched. */
let HILITE = null;   // runtime state; seeded from CHART.highlight, toggled by clicks
function isHi(key, idx){
  if(!HILITE || !HILITE.length) return null;
  return HILITE.some(v => v===key || v===idx);
}

/* --------------------------------------------------------------------------
   Series filter — column/bar charts with 2+ series only. SERIES_ON is the set
   of series names currently checked; null means "not yet built" (treated as
   everything on). This is a structural filter, not a visual one: unlike
   HILITE (which darkens one mark and washes the rest out but keeps every mark
   on the chart), an unchecked series is not drawn at all, and its absence
   changes how the remaining bars are laid out and sorted. The two systems
   are independent and can be used at the same time.
   ----------------------------------------------------------------------- */
let SERIES_ON = null;

/* The category display order. Categories keep the order they were authored
   in as long as every series is checked — toggling everything back on always
   returns to exactly the original chart. The moment fewer than all series are
   checked, categories re-sort by the sum of whatever's checked, because
   "sorted by the thing you're looking at" is the point of unchecking boxes in
   the first place. Returns original-array indices, not display positions, so
   callers can always look up both a category's label and its data by the same
   index they get back. */
function categoryOrder(){
  const n = CHART.categories.length;
  const order = Array.from({length:n}, (_,i)=>i);
  if(!SERIES_ON || SERIES_ON.size === CHART.series.length) return order;
  const S = activeSeries();
  const sums = order.map(i => S.reduce((a,se)=> a + (+se.data[i]||0), 0));
  return order.slice().sort((a,b)=> sums[b]-sums[a]);
}
function emphasise(col, hi, isLine){
  if(hi===null) return col;
  if(hi) return darken(col, 0.18);
  return isLine ? '#D1D5DB' : lighten(col, 0.72);
}
/* Text is not a mark. A washed-out line still reads as a line at 1.3:1 contrast
   because it is a continuous shape, but a washed-out *label* is simply
   illegible. So de-emphasised series keep a readable label colour even as the
   line or bar they belong to recedes. */
function labelColour(col, hi){ return hi===false ? T.muted : col; }

/* --- x window ----------------------------------------------------------
   VIEW is the visible x range in xval() space, driven by the Range control or
   pinned in the config as `xRange`. Filtering here rather than at draw time
   means the headline's last-value label, the axis ticks, the exports and the
   tooltips all agree about what "latest" means. */
/* Scales and smoothing are runtime state, seeded from the config but driven by
   the dropdowns. Whatever is on screen is what exports, so a reader of the PNG
   sees the same axis the chart was checked on. */
let SX = 'linear', SY = 'linear';
let SMOOTH = 1, SMOOTH_LABEL = '';

/* How often the series is observed, read off the median gap between x values.
   Needed because a "weekly moving average" means 7 points on daily data and
   nothing at all on annual data. */
function detectFreq(){
  if(CHART.type === 'column' || CHART.type === 'bar' || CHART.type === 'scatter') return null;
  const all = [];
  CHART.series.forEach(se => se.data.forEach(d => all.push(xval(d[0]))));
  const u = Array.from(new Set(all)).sort((a,b) => a-b);
  if(u.length < 6) return null;
  const gaps = [];
  for(let i=1;i<u.length;i++) gaps.push(u[i]-u[i-1]);
  gaps.sort((a,b) => a-b);
  const med = gaps[Math.floor(gaps.length/2)];
  if(CHART.xType === 'date'){
    const day = 864e5;
    if(med <= 2*day)   return 'daily';
    if(med <= 9*day)   return 'weekly';
    if(med <= 45*day)  return 'monthly';
    if(med <= 120*day) return 'quarterly';
    if(med <= 400*day) return 'yearly';
    return null;
  }
  if((CHART.xType === 'year' || CHART.xType === 'number') && Math.abs(med-1) < 0.01)
    return 'yearly';
  return null;
}

/* Window lengths in observations. Only windows longer than one observation and
   short enough to leave a usable line are offered — a 5-year average over six
   years of annual data is two points and a straight line. */
const SMOOTH_WINDOWS = {
  daily:     [['Weekly moving average',7],['Monthly moving average',30],
              ['Yearly moving average',365],['5-year moving average',1825]],
  weekly:    [['Monthly moving average',4],['Yearly moving average',52],
              ['5-year moving average',260]],
  monthly:   [['Yearly moving average',12],['5-year moving average',60]],
  quarterly: [['Yearly moving average',4],['5-year moving average',20]],
  yearly:    [['5-year moving average',5]]
};
function smoothOptions(){
  const f = detectFreq();
  if(!f) return [];
  const n = Math.max.apply(null, CHART.series.map(se => se.data.length));
  return (SMOOTH_WINDOWS[f] || []).filter(o => o[1] > 1 && o[1] <= n/2);
}

/* Trailing, with no partial windows: the first w-1 observations are dropped
   rather than averaged over a shorter span, because a "12-month average" built
   from three months is not one. */
function smoothData(data){
  if(SMOOTH <= 1 || data.length < SMOOTH) return data;
  const out = [];
  for(let i = SMOOTH-1; i < data.length; i++){
    let sum = 0;
    for(let k = 0; k < SMOOTH; k++) sum += +data[i-k][1];
    const p = [data[i][0], sum/SMOOTH];
    if(data[i].length > 2) p.push(data[i][2]);
    out.push(p);
  }
  return out;
}

/* Smoothing has to be disclosed on the chart itself, not just in the UI — the
   PNG travels without the dropdown that produced it. */
function subheadText(){
  let base = CHART.subhead || '';
  if(SMOOTH > 1 && SMOOTH_LABEL){
    const tag = SMOOTH_LABEL.replace(' moving average', '') + ' trailing average';
    base = base ? base + '  ·  ' + tag : tag;
  }
  /* A filtered bar/column chart has to say so on the chart itself — a PNG
     travels without the checkboxes that produced it, same reasoning as the
     smoothing tag above. */
  if((CHART.type==='column' || CHART.type==='bar') && SERIES_ON
     && SERIES_ON.size < CHART.series.length && CHART.series.length > 1){
    const names = CHART.series.filter(se => SERIES_ON.has(se.name)).map(se => se.name);
    const tag = 'Showing: ' + names.join(' + ');
    base = base ? base + '  ·  ' + tag : tag;
  }
  return base;
}

let VIEW = null;
/* What the Range control filters on. For a line it is the x value. For a
   scatter, x is a measurement — filtering unemployment rates between 4 and 6
   would be meaningless — so it filters on each point's date label instead. */
function rangeKey(d){
  if(CHART.type==='scatter') return d.length>2 ? new Date(String(d[2])+'T00:00:00Z').getTime() : null;
  return xval(d[0]);
}
function hasRangeKeys(){
  return CHART.type!=='scatter' ||
    CHART.series.every(se => se.data.every(d => d.length>2 && !isNaN(new Date(String(d[2])+'T00:00:00Z'))));
}
/* type:'panels' has no CHART.series at all — every function below that walks
   CHART.series (headerLayout, the smoothing/zoom UI, the series filter) is
   series-shaped, so panels is treated as "zero series" everywhere that logic
   runs and gets its own drawing path (drawPanels) and its own zoom source
   (seriesLike()) instead. */
function seriesLike(){
  if(CHART.type === 'panels') return (CHART.panels||[]).map(p=>({name:p.label, data:p.data}));
  return CHART.series;
}
function activeSeries(){
  if(CHART.type==='panels') return [];
  if(CHART.type==='column' || CHART.type==='bar'){
    if(!SERIES_ON || SERIES_ON.size === CHART.series.length) return CHART.series;
    return CHART.series.filter(se => SERIES_ON.has(se.name));
  }
  if(!VIEW && SMOOTH <= 1) return CHART.series;
  /* Smooth first, filter second: a trailing average at the left edge of the
     visible window should use the observations before it, not restart there. */
  const out = CHART.series.map(se=>{
    let data = smoothData(se.data);
    if(VIEW) data = data.filter(d => {
      const k = rangeKey(d);
      return k===null || (k >= VIEW[0]-1e-9 && k <= VIEW[1]+1e-9);
    });
    return { name: se.name, color: se.color, data: data };
  }).filter(se => se.data.length);
  return out.length ? out : CHART.series;
}

/* --------------------------------------------------------------------------
   Header layout is measured before anything is drawn, because the headline
   wraps to a different number of lines at every width. If the plot height were
   a fixed fraction of the canvas, a three-line headline on a phone would
   squeeze the chart into a sliver — the exact failure this avoids.
   It also decides how series get labelled, since that claims horizontal space:
     'end'    direct labels at the end of each line (best — no colour decoding)
     'float'  single series, value floated above the final point
     'legend' too many series or too little width; a wrapped legend row
   ----------------------------------------------------------------------- */
function headerLayout(ctx, W, P){
  const s = P.s, pad = T.pad*s, safe = P.safe;
  const L = safe.l + pad, R = W - safe.r - pad, innerW = R - L;
  const S = activeSeries();
  const isCat = CHART.type==='column' || CHART.type==='bar';

  const hz = s * hscale(P);          // headline/subhead scale, see PRESETS
  ctx.font = T.headWeight + ' ' + (T.szHead*hz) + 'px ' + T.fTitle;
  const hLines = wrap(ctx, CHART.headline, innerW);
  const hLH = T.szHead*hz*1.2;
  let h = T.szHead*hz*0.9 + hLines.length*hLH - (hLH - T.szHead*hz*0.30);

  let sLines = [], sLH = T.szSub*hz*1.38;
  if(CHART.subhead){
    ctx.font = '400 ' + (T.szSub*hz) + 'px ' + T.fBody;
    sLines = wrap(ctx, subheadText(), innerW);
    h += T.szSub*hz*1.05 + sLines.length*sLH - (sLH - T.szSub*hz*0.30);
  }

  let mode = 'none', rightPad = T.gap*s;
  if(isCat || CHART.type==='scatter'){
    mode = (S.length>1 && !(CHART.barNames && CHART.type==='column' && !CHART.stacked))
      ? 'legend' : 'none';
  } else {
    ctx.font = '700 ' + (T.szLabel*s) + 'px ' + T.fBody;
    let need = 0;
    S.forEach(se=>{
      const last = se.data[se.data.length-1];
      const txt = S.length>1 ? se.name : fmt(last[1]);
      need = Math.max(need, ctx.measureText(txt).width + T.gap*s*1.5);
    });
    if(S.length>4 || need > innerW*0.26) mode = S.length>1 ? 'legend' : 'float';
    else { mode = 'end'; rightPad = need; }
  }

  let legend = null;
  if(mode==='legend'){
    ctx.font = '600 ' + (T.szAxis*s) + 'px ' + T.fBody;
    const dot = T.dotR*s*1.5, itemGap = T.gap*s*2.0;
    const rows = [[]]; let w = 0;
    S.forEach((se,i)=>{
      const iw = ctx.measureText(se.name).width + dot + T.gap*s*0.8;
      if(w + iw > innerW && rows[rows.length-1].length){ rows.push([]); w = 0; }
      const hi = isHi(se.name, origIndex(se));
      rows[rows.length-1].push({name:se.name, i:i, w:iw, hi:hi,
        color: emphasise(seriesColor(origIndex(se),se), hi, true)});
      w += iw + itemGap;
    });
    legend = {rows:rows, rowH:T.szAxis*s*1.85, dot:dot, itemGap:itemGap};
    h += T.gap*s*1.2 + rows.length*legend.rowH;
  }

  return {L:L, R:R, innerW:innerW, hLines:hLines, hLH:hLH, sLines:sLines, sLH:sLH,
          headerH:h, mode:mode, rightPad:rightPad, legend:legend};
}


/* ==========================================================================
   Renderer — one draw path for screen and for every export size, so what you
   see on screen is exactly what downloads.
   ======================================================================= */
let HIT = [];     // clickable / hoverable marks
let LEGHIT = [];  // clickable legend items, in design-space rects
let PATHS = [];   // drawn polylines, so labels can be kept off the lines
let LABELS_DROPPED = [];  // point labels that could not be placed without
                          // overlapping; surfaced in the console so a silent
                          // omission never passes for a deliberate one
let PANEL_GEOM = null;    // type:'panels' only — each row's plot rect, so the
                          // shared crosshair tooltip can find every panel's
                          // point at the hovered x without recomputing scales

function draw(ctx, W, H, P, opts){
  opts = opts || {};
  const s = P.s, pad = T.pad*s, safe = P.safe;
  const HL = headerLayout(ctx, W, P);
  const L = HL.L, R = HL.R, innerW = HL.innerW;
  let y = safe.t + pad;

  ctx.save();
  ctx.fillStyle = T.bg; ctx.fillRect(0,0,W,H);
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';

  /* headline — must use the same scale headerLayout measured with, or the
     reserved block and the drawn block disagree and the plot shifts. */
  const hz = s * hscale(P);
  ctx.font = T.headWeight + ' ' + (T.szHead*hz) + 'px ' + T.fTitle;
  ctx.fillStyle = T.ink;
  y += T.szHead*hz*0.9;
  HL.hLines.forEach(ln=>{ ctx.fillText(ln, L, y); y += HL.hLH; });
  y -= HL.hLH - T.szHead*hz*0.30;

  /* subhead */
  if(HL.sLines.length){
    ctx.font = '400 ' + (T.szSub*hz) + 'px ' + T.fBody;
    ctx.fillStyle = T.muted;
    y += T.szSub*hz*1.05;
    HL.sLines.forEach(ln=>{ ctx.fillText(ln, L, y); y += HL.sLH; });
    y -= HL.sLH - T.szSub*hz*0.30;
  }

  /* Legend, only when direct labelling isn't possible. Each item is recorded as
     a click target: a legend that names the colours but cannot be used to
     isolate one is a worse version of the same information. */
  LEGHIT = [];
  if(HL.legend){
    const lg = HL.legend;
    ctx.font = '600 ' + (T.szAxis*s) + 'px ' + T.fBody;
    y += T.gap*s*1.2;
    lg.rows.forEach(row=>{
      y += lg.rowH;
      let x = L;
      row.forEach(it=>{
        ctx.fillStyle = it.color;
        ctx.beginPath();
        ctx.arc(x + lg.dot*0.42, y - T.szAxis*s*0.30, lg.dot*0.42, 0, 6.284);
        ctx.fill();
        /* Dimmed but never washed out: the label still has to be readable when
           its series is the one being pushed back. */
        ctx.fillStyle = it.hi === false ? T.muted : T.ink;
        ctx.fillText(it.name, x + lg.dot + T.gap*s*0.4, y - T.szAxis*s*0.06);
        LEGHIT.push({key:it.name,
                     x0:x - T.gap*s*0.3, x1:x + it.w + T.gap*s*0.3,
                     y0:y - lg.rowH*0.92, y1:y + lg.rowH*0.18});
        x += it.w + lg.itemGap;
      });
    });
  }

  const alSpace = axisLabelSpace(P);
  const plotTop = y + T.gap*s*1.9 + alSpace.top;
  const footH = footerHeight(ctx, P, L, R);
  const plotBottom = H - safe.b - pad - footH;

  if(CHART.type === 'panels'){
    const g = drawPanels(ctx, P, L, R, plotTop, plotBottom);
    drawFooter(ctx, W, H, P, L, R, opts);
    ctx.restore();
    return g;
  }

  /* value range */
  const isCat = CHART.type==='column' || CHART.type==='bar';
  const S = activeSeries();
  let vals = [];
  if(isCat && CHART.stacked){
    for(let i=0;i<CHART.categories.length;i++){
      let pos=0,neg=0;
      S.forEach(se=>{ const v=+se.data[i]||0; if(v>=0) pos+=v; else neg+=v; });
      vals.push(pos,neg);
    }
  } else {
    S.forEach(se=> se.data.forEach(d => vals.push(isCat ? +d : +d[1])));
  }
  vals = vals.filter(v=>!isNaN(v));
  const ySc = isCat ? 'linear' : SY;
  const xSc = isCat ? 'linear' : SX;
  const yLog = ySc === 'log', ySqrt = ySc === 'sqrt';
  const xLog = xSc === 'log', xSqrt = xSc === 'sqrt';
  assertDomain(vals, 'y', ySc);

  const hasMin = CHART.yMin!==null && CHART.yMin!==undefined;
  const hasMax = CHART.yMax!==null && CHART.yMax!==undefined;
  let vMin = hasMin ? CHART.yMin : Math.min.apply(null,vals);
  let vMax = hasMax ? CHART.yMax : Math.max.apply(null,vals);
  if(yLog){
    /* Percentage padding is meaningless in log space; snap to decades. */
    const sp = logSpan(hasMin ? vMin : Math.min.apply(null,vals),
                       hasMax ? vMax : Math.max.apply(null,vals));
    if(!hasMin) vMin = sp[0];
    if(!hasMax) vMax = sp[1];
  } else if(ySqrt){
    /* A square-root axis that does not start at zero throws away the reason to
       use one: the compression is only interpretable relative to the origin. */
    if(!hasMin) vMin = 0;
    if(!hasMax) vMax = vMax + (vMax - vMin)*0.05;
  } else {
    if(CHART.yZero || isCat){ vMin = Math.min(vMin,0); vMax = Math.max(vMax,0); }
    if(vMin===vMax){ vMin-=1; vMax+=1; }
    const padv = (vMax-vMin)*0.08;
    if(!hasMin && !(CHART.yZero||isCat)) vMin -= padv;
    if(!hasMax) vMax += padv;
  }
  /* Forward transforms. Hit-testing is done in screen space, so no inverse
     is needed anywhere. */
  const tY = tfm(ySc);
  const tX = tfm(xSc);

  if(CHART.type === 'bar'){
    const g = drawHBars(ctx, P, L, R, innerW, plotTop, plotBottom - T.szAxis*s*0.4);
    drawFooter(ctx, W, H, P, L, R, opts);
    ctx.restore();
    return g;
  }

  const tallish = P.h/P.w > 1.2;
  const tk = scaleTicks(ySc, vMin, vMax, tallish ? 4 : 5);

  /* left margin from the widest tick label — measured, never guessed */
  ctx.font = '500 ' + (T.szAxis*s) + 'px ' + T.fBody;
  let yLabW = 0;
  tk.forEach(t => { yLabW = Math.max(yLabW, ctx.measureText(fmt(t)).width); });

  const wantEndLabels = HL.mode === 'end';
  const rightPad = HL.rightPad;

  const pL = L + yLabW + T.gap*s*1.1;
  const pR = R - rightPad;
  const pT = plotTop;
  const pB = plotBottom - T.szAxis*s*1.9 - alSpace.bottom;
  const pw = pR-pL, ph = pB-pT;
  const yLo = tY(vMin), yHi = tY(vMax);
  const Y = v => pB - (tY(v)-yLo)/(yHi-yLo)*ph;

  /* x scale */
  let X, Xn, xs=[], xSpan=0, xMin=0, xMax=0;
  if(isCat){
    const n = CHART.categories.length;
    X = i => pL + (i+0.5)*pw/n;
  } else {
    S.forEach(se => se.data.forEach(d => xs.push(xval(d[0]))));
    assertDomain(xs, 'x', xSc);
    const hasXMin = CHART.xMin!==null && CHART.xMin!==undefined;
    const hasXMax = CHART.xMax!==null && CHART.xMax!==undefined;
    xMin = Math.min.apply(null,xs);
    xMax = Math.max.apply(null,xs);
    if(xSqrt && !hasXMin) xMin = 0;
    if(xLog && !(hasXMin && hasXMax)){
      /* Snapping to whole decades gives round numbers at the ends, but it
         overshoots when the data sits just inside a decade — 9,492 to 176M
         snaps to 1k–1B and leaves a third of the plot empty. Pin xMin/xMax
         when that happens. */
      const sp = logSpan(xMin, xMax);
      if(!hasXMin) xMin = sp[0];
      if(!hasXMax) xMax = sp[1];
    }
    if(hasXMin) xMin = CHART.xMin;
    if(hasXMax) xMax = CHART.xMax;
    const xLo = tX(xMin), xHi = tX(xMax);
    xSpan = (xHi - xLo) || 1;
    /* Two entry points on purpose. Xn takes an x that has already been through
       xval() — a timestamp, a year number. X takes a raw config value and
       converts first. Collapsing them into one guessing function is what broke
       every date axis: a timestamp was fed back through the date parser and
       came out NaN, so the labels vanished off-canvas. */
    Xn = v => pL + (tX(v) - xLo)/xSpan*pw;
    X  = x => Xn(xval(x));
  }

  /* shaded bands — full height */
  if(!isCat && CHART.bands) CHART.bands.forEach(b=>{
    const x0=Math.max(pL,X(b.x0)), x1=Math.min(pR,X(b.x1));
    if(x1>x0){ ctx.fillStyle=T.band; ctx.fillRect(x0,pT,x1-x0,ph); }
  });

  /* shaded regions — bounded on both axes. Drawn under the gridlines so the
     grid still reads through them. */
  if(!isCat && CHART.regions) CHART.regions.forEach(g=>{
    const x0 = Math.max(pL, g.x0==null ? pL : X(g.x0));
    const x1 = Math.min(pR, g.x1==null ? pR : X(g.x1));
    const yA = g.y1==null ? pT : Y(g.y1);
    const yB = g.y0==null ? pB : Y(g.y0);
    const y0 = Math.max(pT, Math.min(yA,yB));
    const y1 = Math.min(pB, Math.max(yA,yB));
    if(x1>x0 && y1>y0){ ctx.fillStyle=T.band; ctx.fillRect(x0,y0,x1-x0,y1-y0); }
  });

  /* gridlines + y labels */
  ctx.lineWidth = Math.max(1, s*0.7);
  ctx.font = '500 ' + (T.szAxis*s) + 'px ' + T.fBody;
  ctx.textAlign='right';
  tk.forEach(t=>{
    const yy = Y(t);
    ctx.strokeStyle = (Math.abs(t)<1e-9 && vMin<0) ? T.zero : T.grid;
    ctx.beginPath(); ctx.moveTo(pL,yy); ctx.lineTo(pR,yy); ctx.stroke();
    ctx.fillStyle = T.muted;
    ctx.fillText(fmt(t), pL - T.gap*s*0.85, yy + T.szAxis*s*0.36);
  });
  ctx.textAlign='left';

  /* x labels */
  ctx.fillStyle = T.muted;
  ctx.font = '500 ' + (T.szAxis*s) + 'px ' + T.fBody;
  const xLabY = pB + T.szAxis*s*1.7;
  if(isCat){
    const slot = pw/CHART.categories.length;
    ctx.textAlign='center';
    categoryOrder().forEach((origI,i)=>{
      let txt = String(CHART.categories[origI]);
      /* Shrinking text to fit is how axis labels become unreadable on a phone.
         Truncate instead — or switch to type:'bar' so each label gets a line. */
      while(ctx.measureText(txt).width > slot*0.94 && txt.length>3) txt = txt.slice(0,-2)+'…';
      ctx.fillText(txt, X(i), xLabY);
    });
    ctx.textAlign='left';
  } else if(xLog || xSqrt){
    /* Decades, not data values. Picking from the observed x values — which is
       right for a time series, where they are years — would put 9,492 and
       176,000,000 on a population axis. */
    const picks = scaleTicks(xSc, xMin, xMax, 5);
    picks.forEach((v,i)=>{
      const px = Xn(v);
      ctx.strokeStyle = T.grid;
      ctx.beginPath(); ctx.moveTo(px,pT); ctx.lineTo(px,pB); ctx.stroke();
      ctx.fillStyle = T.muted;
      ctx.textAlign = i===0 ? 'left' : (i===picks.length-1 ? 'right' : 'center');
      ctx.fillText(xlabel(v, xSpan), Math.min(Math.max(px,pL),pR), xLabY);
    });
    ctx.textAlign='left';
  } else {
    const uniq = Array.from(new Set(xs)).sort((a,b)=>a-b);
    const per = ctx.measureText('2020').width*2.9;
    const maxLab = Math.max(2, Math.floor(pw/per));
    const step = Math.max(1, Math.ceil(uniq.length/maxLab));
    const picks = [];
    for(let i=0;i<uniq.length;i+=step) picks.push(uniq[i]);
    if(picks[picks.length-1] !== uniq[uniq.length-1]) picks.push(uniq[uniq.length-1]);
    picks.forEach((v,i)=>{
      const px = Xn(v);
      ctx.textAlign = i===0 ? 'left' : (i===picks.length-1 ? 'right' : 'center');
      ctx.fillText(xlabel(v, xSpan), Math.min(Math.max(px,pL),pR), xLabY);
    });
    ctx.textAlign='left';
  }

  /* reference lines */
  if(!isCat && CHART.rules) CHART.rules.forEach(r=>{
    const vertical = (r.axis||'x') === 'x';
    const p = vertical ? X(r.at) : Y(r.at);
    if(vertical ? (p<pL-0.5 || p>pR+0.5) : (p<pT-0.5 || p>pB+0.5)) return;
    ctx.save();
    ctx.strokeStyle = T.zero;
    ctx.lineWidth = Math.max(1.1, s*0.95);
    ctx.setLineDash([s*5, s*4]);
    ctx.beginPath();
    if(vertical){ ctx.moveTo(p,pT); ctx.lineTo(p,pB); }
    else        { ctx.moveTo(pL,p); ctx.lineTo(pR,p); }
    ctx.stroke();
    ctx.setLineDash([]);
    if(r.label){
      ctx.font = '600 ' + (T.szAnno*s) + 'px ' + T.fBody;
      ctx.fillStyle = T.faint;
      if(vertical){
        const w = ctx.measureText(r.label).width;
        ctx.textAlign = (p + w + T.gap*s > pR) ? 'right' : 'left';
        const off = ctx.textAlign==='right' ? -T.gap*s*0.6 : T.gap*s*0.6;
        ctx.fillText(r.label, p + off, pT + T.szAnno*s*1.15);
      } else {
        ctx.textAlign = 'left';
        ctx.fillText(r.label, pL + T.gap*s*0.6, p - T.szAnno*s*0.5);
      }
      ctx.textAlign = 'left';
    }
    ctx.restore();
  });

  /* axis titles */
  if(CHART.yLabel){
    ctx.font = '600 ' + (T.szAxis*s) + 'px ' + T.fBody;
    ctx.fillStyle = T.muted; ctx.textAlign = 'left';
    ctx.fillText(CHART.yLabel, L, pT - T.szAxis*s*0.85);
  }
  if(CHART.xLabel){
    ctx.font = '600 ' + (T.szAxis*s) + 'px ' + T.fBody;
    ctx.fillStyle = T.muted; ctx.textAlign = 'center';
    ctx.fillText(CHART.xLabel, (pL+pR)/2, pB + T.szAxis*s*1.7 + alSpace.bottom*0.72);
    ctx.textAlign = 'left';
  }

  /* marks */
  HIT = []; PATHS = []; LABELS_DROPPED = [];
  const showVals = CHART.valueLabels==='auto'
      ? (isCat && CHART.categories.length<=12 && !CHART.stacked)
      : !!CHART.valueLabels;

  if(isCat){
    const order = categoryOrder();
    const n = order.length, slot = pw/n;
    const bandW = slot*0.66;
    const nS = CHART.stacked ? 1 : S.length;
    const bw = bandW/nS;
    const tops = new Array(n).fill(0), bots = new Array(n).fill(0);
    S.forEach((se,si)=>{
      order.forEach((origI,i)=>{
        const v = +se.data[origI]||0;
        const cat = CHART.categories[origI];
        const hi = isHi(cat, origI);
        const col = emphasise(seriesColor(origIndex(se),se), hi, false);
        let y0,y1,x0,w;
        if(CHART.stacked){
          const base = v>=0 ? tops[i] : bots[i];
          y0 = Y(base); y1 = Y(base+v);
          if(v>=0) tops[i]+=v; else bots[i]+=v;
          x0 = X(i)-bandW/2; w = bandW;
        } else {
          y0 = Y(0); y1 = Y(v);
          x0 = X(i)-bandW/2 + si*bw; w = bw*0.9;
        }
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.roundRect(x0, Math.min(y0,y1), w, Math.max(Math.abs(y1-y0),1), 2*s);
        ctx.fill();
        HIT.push({x:x0+w/2, y:Math.min(y0,y1), cx:x0+w/2, cy:(y0+y1)/2,
                  v:v, cat:cat, key:cat, color:col});
        /* Series name inside the bar, replacing the legend. Sized to the bar's
           width, capped at headline size; skipped if the bar is too short. */
        if(CHART.barNames && CHART.type==='column' && !CHART.stacked && v>0){
          ctx.font = '700 100px ' + T.fBody;
          const fit = 100 * (w*0.78) / ctx.measureText(se.name).width;
          const fz = Math.min(T.szHead*s*1.15, fit);
          const bh = Math.abs(y1-y0);
          if(bh > fz*2){
            ctx.font = '700 ' + fz + 'px ' + T.fBody;
            ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center';
            ctx.fillText(se.name, x0+w/2, Math.min(y0,y1) + fz*1.35);
            ctx.textAlign = 'left';
          }
        }
        if(showVals){
          ctx.font = '700 ' + (T.szLabel*s) + 'px ' + T.fBody;
          ctx.fillStyle = labelColour(col, hi); ctx.textAlign='center';
          const ly = v>=0 ? Math.min(y0,y1)-T.gap*s*0.6 : Math.max(y0,y1)+T.szLabel*s*1.15;
          ctx.fillText(fmt(v), x0+w/2, ly);
          ctx.textAlign='left';
        }
      });
    });
  } else if(CHART.type==='scatter'){
    S.forEach((se)=>{
      const oi = origIndex(se);
      const hi = isHi(se.name, oi);
      const col = emphasise(seriesColor(oi,se), hi, true);
      ctx.fillStyle = col;
      se.data.forEach(d=>{
        ctx.globalAlpha=.82;
        ctx.beginPath(); ctx.arc(X(d[0]), Y(d[1]), T.dotR*s*1.05, 0, 6.284); ctx.fill();
        ctx.globalAlpha=1;
        /* A scatter point's identity is its third element — usually the date it
           came from. Without it a hover can only report the two coordinates the
           reader can already see, which tells them nothing. */
        HIT.push({x:X(d[0]), y:Y(d[1]), v:d[1], xv:d[0], cat:d[0],
                  key:se.name, pt:(d.length>2 ? d[2] : null), color:col});
      });
    });
  } else {
    const endLabels = [];
    S.forEach((se)=>{
      const oi = origIndex(se);
      const hi = isHi(se.name, oi);
      const col = emphasise(seriesColor(oi,se), hi, true);
      const labCol = labelColour(col, hi);
      const pts = se.data.map(d=>[X(d[0]), Y(d[1])]);
      if(CHART.type==='area'){
        const base = Y(Math.max(vMin,0));
        ctx.globalAlpha=.13; ctx.fillStyle=col;
        ctx.beginPath(); ctx.moveTo(pts[0][0], base);
        pts.forEach(p=>ctx.lineTo(p[0],p[1]));
        ctx.lineTo(pts[pts.length-1][0], base);
        ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
      }
      ctx.strokeStyle=col; ctx.lineWidth=T.lineW*s;
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.beginPath();
      pts.forEach((p,i)=> i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]));
      ctx.stroke();

      /* Terminal dot + direct label. A legend makes the reader look away from
         the data to decode colors — worst possible move on a small screen. */
      const last = pts[pts.length-1];
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(last[0], last[1], T.dotR*s, 0, 6.284); ctx.fill();
      const lastV = fmt(se.data[se.data.length-1][1]);
      if(wantEndLabels){
        endLabels.push({x:last[0], y:last[1], y0:last[1], name:se.name, val:lastV, color:labCol});
      } else if(HL.mode==='float'){
        /* Narrow screen: float the latest value over the final point rather
           than surrender a quarter of the plot width to a margin. */
        ctx.font = '700 ' + (T.szLabel*s) + 'px ' + T.fBody;
        ctx.fillStyle = labCol;
        ctx.textAlign = 'right';
        let ly = last[1] - T.dotR*s - T.gap*s*0.9;
        if(ly - T.szLabel*s < pT) ly = last[1] + T.dotR*s + T.szLabel*s*1.3;
        ctx.fillText(lastV, Math.min(last[0] + T.gap*s*0.7, pR), ly);
        ctx.textAlign = 'left';
      }
      PATHS.push(pts);
      se.data.forEach((d,i)=> HIT.push({x:pts[i][0], y:pts[i][1],
        v:d[1], cat:d[0], key:se.name, color:col}));
    });

    /* Two countries ending on the same number put their labels on the same
       pixel. Stack them apart by the minimum readable spacing, keep the stack
       inside the plot, and accept a small offset from the line — a label that
       is 8px off its endpoint is fine; two labels on top of each other are not. */
    if(endLabels.length){
      const twoLine = S.length > 1;
      const blockH = twoLine ? T.szLabel*s*1.10 + T.szAxis*s*1.18 : T.szLabel*s*1.15;
      endLabels.sort((a,b)=>a.y-b.y);
      for(let i=1;i<endLabels.length;i++){
        if(endLabels[i].y - endLabels[i-1].y < blockH)
          endLabels[i].y = endLabels[i-1].y + blockH;
      }
      const over = endLabels[endLabels.length-1].y + (twoLine?T.szAxis*s*1.18:0) - pB;
      if(over > 0) endLabels.forEach(l => l.y -= over);
      const under = pT + T.szLabel*s*0.55 - endLabels[0].y;
      if(under > 0) endLabels.forEach(l => l.y += under);

      endLabels.forEach(l=>{
        const lx = l.x + T.gap*s*1.1;
        /* A short elbow back to the point, drawn only when the label moved. */
        if(Math.abs(l.y - l.y0) > 2){
          ctx.strokeStyle = mix(l.color, '#FFFFFF', 0.55);
          ctx.lineWidth = Math.max(1, s*0.9);
          ctx.beginPath();
          ctx.moveTo(l.x + T.dotR*s*0.9, l.y0);
          ctx.lineTo(lx - T.gap*s*0.35, l.y);
          ctx.stroke();
        }
        ctx.font = '700 ' + (T.szLabel*s) + 'px ' + T.fBody;
        ctx.fillStyle = l.color;
        ctx.fillText(twoLine ? l.name : l.val, lx, l.y + T.szLabel*s*0.36);
        if(twoLine){
          ctx.font = '500 ' + (T.szAxis*s) + 'px ' + T.fBody;
          ctx.fillStyle = T.muted;
          ctx.fillText(l.val, lx, l.y + T.szLabel*s*0.36 + T.szAxis*s*1.18);
        }
      });
    }
  }

  /* Annotations. The requested offset is treated as a preference, not an
     instruction: if the label would land on top of the data it flips to a free
     side. Text is then painted with a background-coloured halo, because even a
     well-placed label eventually crosses a gridline or a line, and a halo keeps
     it readable without adding a boxed callout to an otherwise clean chart. */
  /* Sample the drawn lines densely. Testing only the data vertices was not
     enough — between two points a line sweeps across a lot of canvas, and a
     label placed there looks like it was thrown at the chart. */
  const obstacles = [];
  PATHS.forEach(p=>{
    for(let i=1;i<p.length;i++){
      const a0=p[i-1], a1=p[i];
      const n = Math.max(2, Math.round(Math.hypot(a1[0]-a0[0], a1[1]-a0[1])/(5*s)));
      for(let k=0;k<=n;k++)
        obstacles.push({x:a0[0]+(a1[0]-a0[0])*k/n, y:a0[1]+(a1[1]-a0[1])*k/n});
    }
  });
  if(!obstacles.length) HIT.forEach(h=>obstacles.push(h));

  (CHART.annotations||[]).forEach(a=>{
    const ax = isCat ? X(CHART.categories.indexOf(a.x)) : X(a.x);
    const ay = Y(a.y);
    if(!isFinite(ax) || ax < pL-2 || ax > pR+2) return;   // outside the x window

    ctx.font = '600 ' + (T.szAnno*s) + 'px ' + T.fBody;
    const lines = wrap(ctx, a.text, innerW*0.44);
    const lh = T.szAnno*s*1.28;
    let tw = 0; lines.forEach(l => { tw = Math.max(tw, ctx.measureText(l).width); });
    const th = (lines.length-1)*lh + T.szAnno*s;

    const dx0 = (a.dx===undefined ? 0 : a.dx)*s;
    const dy0 = (a.dy===undefined ? -28 : a.dy)*s;
    const mag = Math.abs(dy0) || 28*s;
    const nudge = Math.max(Math.abs(dx0), T.gap*s*1.4);

    /* The author's offset is candidate zero and gets a small bonus; the rest
       sweep above and below at increasing distance, on both sides. */
    const cands = [[dx0,dy0]];
    [-1,1].forEach(sy=>{
      [1, 1.7, 2.5, 3.4].forEach(m=>{
        cands.push([dx0, sy*mag*m]);
        cands.push([nudge, sy*mag*m]);
        cands.push([-nudge, sy*mag*m]);
      });
    });

    let best = cands[0], bestScore = Infinity;
    cands.forEach((o,ci)=>{
      const tx = ax+o[0], ty = ay+o[1];
      const x0 = o[0] < 0 ? tx-tw : tx;
      const y0 = ty - T.szAnno*s;
      const padx = 5*s, pady = 4*s;
      let score = ci===0 ? -10 : 0;
      let near = Infinity;
      obstacles.forEach(h=>{
        if(h.x > x0-padx && h.x < x0+tw+padx && h.y > y0-pady && h.y < y0+th+pady)
          score += 12;                                  // sitting on the data
        const dx = h.x < x0 ? x0-h.x : (h.x > x0+tw ? h.x-x0-tw : 0);
        const dy = h.y < y0 ? y0-h.y : (h.y > y0+th ? h.y-y0-th : 0);
        near = Math.min(near, Math.hypot(dx,dy));
      });
      if(isFinite(near)) score += Math.max(0, 22*s - near) * 0.5;  // prefer clear air
      if(x0 < pL) score += 40 + (pL-x0);                // running off the plot
      if(x0+tw > pR) score += 40 + (x0+tw-pR);
      if(y0 < pT) score += 60 + (pT-y0);
      if(y0+th > pB) score += 60 + (y0+th-pB);
      score += Math.hypot(o[0],o[1]) * 0.015;           // all else equal, stay close
      if(score < bestScore){ bestScore = score; best = o; }
    });

    /* Scoring picks the best of several positions, but scoring alone can still
       land a label past the axis when every candidate is poor. Clamping the
       text box into the plot rectangle makes "inside the chart field" a
       guarantee rather than a preference. */
    const right = best[0] < 0;
    const inset = 3*s;
    let bx = right ? ax + best[0] - tw : ax + best[0];
    let by = ay + best[1] - T.szAnno*s;
    bx = Math.max(pL + inset, Math.min(bx, pR - tw - inset));
    by = Math.max(pT + inset, Math.min(by, pB - th - inset));
    const tx = right ? bx + tw : bx;
    const ty = by + T.szAnno*s;

    ctx.strokeStyle = T.faint; ctx.lineWidth = Math.max(1, s*0.8);
    ctx.beginPath(); ctx.moveTo(ax, ay);
    ctx.lineTo(right ? bx + tw + T.gap*s*0.3 : bx - T.gap*s*0.3, ty + T.szAnno*s*0.3);
    ctx.stroke();

    ctx.textAlign = right ? 'right' : 'left';
    ctx.lineJoin = 'round'; ctx.lineWidth = 3.6*s; ctx.strokeStyle = T.bg;
    lines.forEach((ln,i)=> ctx.strokeText(ln, tx, ty + i*lh));
    ctx.fillStyle = T.ink;
    lines.forEach((ln,i)=> ctx.fillText(ln, tx, ty + i*lh));
    ctx.textAlign = 'left';

    ctx.fillStyle = T.red;
    ctx.beginPath(); ctx.arc(ax, ay, T.dotR*s*0.75, 0, 6.284); ctx.fill();
  });

  /* Point labels. A name sits beside its dot with no leader line and no dot of
     its own — the mark is already there. Placement is first-fit across eight
     offsets rather than scored like an annotation: with a dozen or more labels
     the cheap rule reads the same and cannot spend minutes optimising. A label
     that will not fit is dropped, never shrunk and never overlapped. */
  if(CHART.type==='scatter' && showPointLabels(P) && CHART.pointLabels
     && (CHART.pointLabels === 'all' || CHART.pointLabels.length)){
    const want = CHART.pointLabels === 'all' ? null
               : new Set(CHART.pointLabels.map(String));
    const fsz = T.szAnno*s*0.92;
    ctx.font = '600 ' + fsz + 'px ' + T.fBody;
    const g = T.gap*s*0.65, placed = [], dropped = [];
    const cands = [[1,0.32],[-1,0.32],[1,-0.85],[-1,-0.85],
                   [1,1.35],[-1,1.35],[0,-1.15],[0,1.6],
                   [1,-1.9],[-1,-1.9],[1,2.4],[-1,2.4],
                   [1,-2.9],[-1,-2.9],[1,3.4],[-1,3.4]];

    /* Two passes. The first refuses to put a name on top of any dot; the second
       allows it, because the text carries a background-coloured halo and stays
       readable over a mark. Without the second pass a dense cluster loses every
       label it has — which is exactly where the interesting countries are, so
       dropping them all would quietly delete the argument.
       Label-on-label overlap is refused in both passes: two names on one spot
       are illegible in a way that a name over a dot is not. */
    HIT.forEach(h=>{
      if(!h.pt || (want && !want.has(String(h.pt)))) return;
      const tw = ctx.measureText(h.pt).width, th = fsz;
      let box = null, ta = 'left';
      for(let pass = 0; pass < 2 && !box; pass++){
        for(const c of cands){
          const x = h.x + (c[0]>=0 ? g : -g - tw), y = h.y + th*c[1];
          const b = [x, y-th*0.8, x+tw, y+th*0.25];
          if(b[0] < pL || b[2] > pR || b[1] < pT || b[3] > pB) continue;
          if(placed.some(p => b[0] < p[2] && p[0] < b[2] && b[1] < p[3] && p[1] < b[3])) continue;
          if(pass === 0 && HIT.some(o => o!==h && o.x > b[0]-2*s && o.x < b[2]+2*s
                                  && o.y > b[1]-2*s && o.y < b[3]+2*s)) continue;
          box = b; ta = c[0]>=0 ? 'left' : 'right'; break;
        }
      }
      if(!box){ dropped.push(h.pt); return; }
      placed.push(box);
      const tx = ta==='left' ? box[0] : box[2];
      ctx.textAlign = ta;
      ctx.lineJoin='round'; ctx.lineWidth = 3.2*s; ctx.strokeStyle = T.bg;
      ctx.strokeText(h.pt, tx, box[3]-th*0.25);
      ctx.fillStyle = T.ink;
      ctx.fillText(h.pt, tx, box[3]-th*0.25);
      ctx.textAlign = 'left';
    });
    LABELS_DROPPED = dropped;
  }

  drawFooter(ctx, W, H, P, L, R, opts);
  ctx.restore();
  return {pL:pL,pR:pR,pT:pT,pB:pB};
}

function logoHeight(P){ return CHART.logo===false ? 0 : T.szFoot*P.s*fscale(P)*3.6; }

function logoWidth(ctx, P){
  const h = logoHeight(P);
  if(!h) return 0;
  ctx.font = '700 ' + (h*0.268) + 'px ' + T.fLogo;
  let tw = 0;
  ['ECON','CHRIS','CLARKE'].forEach(t => { tw = Math.max(tw, measureSpaced(ctx, t, h*0.026)); });
  return h + h*0.15 + tw;
}

/* Footer lines are WRAPPED, never truncated. A note explaining a definition
   break or a data gap is content — it is the thing that keeps the chart honest
   when it gets screenshotted — so the footer grows to fit it rather than
   trailing off in an ellipsis. */
function footerLines(ctx, P, L, R){
  const s = P.s * fscale(P);
  const room = R - L - (logoWidth(ctx,P) ? logoWidth(ctx,P) + T.gap*s*2.2 : 0);
  ctx.font = '400 ' + (T.szFoot*s) + 'px ' + T.fBody;
  const parts = [];
  if(CHART.source) parts.push('Source: ' + CHART.source);
  if(CHART.sourceUrl) parts.push(CHART.sourceUrl);
  if(CHART.handle && !logoHeight(P)) parts.push(CHART.handle);
  return {
    src:  (parts.length && showFooterText(P)) ? wrap(ctx, parts.join('   ·   '), room) : [],
    note: (CHART.note && showFooterText(P)) ? wrap(ctx, CHART.note, room) : [],
    lh:   T.szFoot*s*1.45,
    room: room
  };
}

function footerHeight(ctx, P, L, R){
  const s = P.s * fscale(P);
  const f = footerLines(ctx, P, L, R);
  const text = (f.src.length + f.note.length) * f.lh + T.szFoot*s*0.9;
  return Math.max(text, logoHeight(P)*0.95 + T.szFoot*s*1.1);
}

/* Axis titles. The y title sits horizontally above the plot rather than rotated
   up the side: rotated text is slow to read on a phone held in one hand, and
   the space above the top gridline is otherwise wasted. */
function axisLabelSpace(P){
  const s = P.s;
  return { top: CHART.yLabel ? T.szAxis*s*1.75 : 0,
           bottom: CHART.xLabel ? T.szAxis*s*1.7 : 0 };
}

/* Letter-spaced text, measured and drawn a glyph at a time. Canvas has a
   letterSpacing property now but support is uneven, and the wordmark's wide
   tracking is the most recognisable thing about it. */
function drawSpaced(ctx, text, x, y, sp){
  let cx = x;
  for(const ch of text){ ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + sp; }
  return cx - x - sp;
}
function measureSpaced(ctx, text, sp){
  let w = 0;
  for(const ch of text) w += ctx.measureText(ch).width + sp;
  return w - sp;
}

/* The logo is drawn, not placed as an image. A 500px PNG rescaled into a
   1080-wide vertical crop goes soft and pixelated, which is exactly the tell
   that makes a chart look amateur. Drawing it means it is sharp at every export
   size, and it lets the axis and crossing lines carry real weight instead of
   the hairlines that disappear at thumbnail size. */
function drawLogo(ctx, xRight, yBottom, h){
  const sq = h;
  const words = ['ECON','CHRIS','CLARKE'];
  /* Type sized so the three-line block fills 94% of the square: nearly flush,
     with a hair of optical inset so the caps don't look like they're sliding
     off the edge. All-caps means no descenders, so cap-top to final baseline
     is genuinely flush rather than merely close. */
  const tSize = h*0.268, tSp = h*0.026, lineH = tSize*1.395, gap = h*0.15;

  ctx.font = '700 ' + tSize + 'px ' + T.fLogo;
  ctx.textAlign = 'left';
  let tw = 0;
  words.forEach(t => { tw = Math.max(tw, measureSpaced(ctx, t, tSp)); });

  const total = sq + gap + tw;
  const x = xRight - total, y = yBottom - h;

  ctx.fillStyle = T.red;
  ctx.fillRect(x, y, sq, sq);

  ctx.strokeStyle = '#FFFFFF';
  ctx.lineJoin = 'miter';
  ctx.lineCap = 'butt';
  ctx.lineWidth = sq*0.095;
  const ax = x + sq*0.215, ay = y + sq*0.845;
  ctx.beginPath();
  ctx.moveTo(ax, y + sq*0.105);
  ctx.lineTo(ax, ay);
  ctx.lineTo(x + sq*0.905, ay);
  ctx.stroke();

  /* Supply steep, demand shallow, both running axis to axis. The unequal
     slopes are what make this read as a supply-and-demand diagram rather than
     as a generic X — a symmetric cross is a multiplication sign first. */
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + sq*0.30, y + sq*0.82); ctx.lineTo(x + sq*0.80, y + sq*0.14);
  ctx.moveTo(x + sq*0.24, y + sq*0.26); ctx.lineTo(x + sq*0.88, y + sq*0.70);
  ctx.stroke();
  ctx.lineCap = 'butt';

  ctx.fillStyle = T.red;
  ctx.font = '700 ' + tSize + 'px ' + T.fLogo;
  const capH = tSize*0.72;
  const top = y + (h - ((words.length-1)*lineH + capH))/2;
  words.forEach((t,i) => drawSpaced(ctx, t, x + sq + gap, top + capH + i*lineH, tSp));
  return total;
}

function drawFooter(ctx, W, H, P, L, R, opts){
  const s = P.s * fscale(P), pad = T.pad*P.s;
  const fy = H - P.safe.b - pad + T.szFoot*s*0.2;

  let logoW = 0;
  if(opts.logoImg){                       // custom image override
    const lh = logoHeight(P);
    logoW = lh * (opts.logoImg.width/opts.logoImg.height);
    ctx.imageSmoothingEnabled = true;
    if('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(opts.logoImg, R-logoW, fy + T.szFoot*s*0.3 - lh, logoW, lh);
  } else if(CHART.logo !== false){
    logoW = drawLogo(ctx, R, fy + T.szFoot*s*0.3, logoHeight(P));
  }

  const f = footerLines(ctx, P, L, R);
  ctx.textAlign = 'left';
  ctx.font = '400 ' + (T.szFoot*s) + 'px ' + T.fBody;
  ctx.fillStyle = T.faint;

  /* Stack upward from the baseline: source last, note above it. */
  let ly = fy;
  for(let i = f.src.length - 1; i >= 0; i--){ ctx.fillText(f.src[i], L, ly); ly -= f.lh; }
  for(let i = f.note.length - 1; i >= 0; i--){ ctx.fillText(f.note[i], L, ly); ly -= f.lh; }
}

/* --------------------------------------------------------------------------
   Horizontal bars. Deliberately axis-free: every bar is labelled with its
   category on the left and its value at the tip, so there is nothing to trace
   back to and nothing that has to shrink to fit. This is the form to reach for
   whenever category names are longer than a word or two, because each label
   gets a whole line instead of a sliver of the x-axis.

   Two layouts, chosen automatically:
     - stacked (CHART.stacked, and every series is checked in the series
       filter): one bar per category, series concatenated end to end. Tip
       labels are dropped — they'd collide inside the stack — the legend
       above the plot and the hover tooltip carry the numbers instead.
     - grouped (the default, or whenever the series filter has fewer than
       all series checked): one thin bar per visible series per category,
       stacked vertically within the row. With exactly one series checked
       this is just a plain sorted bar of that series, which is deliberate —
       see categoryOrder().
   ----------------------------------------------------------------------- */
function drawHBars(ctx, P, L, R, innerW, pT, pB){
  const s = P.s;
  const cats = CHART.categories;
  const S = activeSeries();
  const order = categoryOrder();
  const n = order.length;
  const stackAll = !!CHART.stacked && S.length === CHART.series.length && CHART.series.length > 1;

  let vals = [];
  if(stackAll){
    order.forEach(i=>{
      let pos=0, neg=0;
      S.forEach(se=>{ const v=+se.data[i]||0; if(v>=0) pos+=v; else neg+=v; });
      vals.push(pos, neg);
    });
  } else {
    S.forEach(se => order.forEach(i => vals.push(+se.data[i]||0)));
  }
  let mn = Math.min(0, Math.min.apply(null, vals));
  let mx = Math.max(0, Math.max.apply(null, vals));
  if(mn === mx) mx = mn + 1;

  ctx.font = '500 ' + (T.szAxis*s) + 'px ' + T.fBody;
  let catW = 0;
  order.forEach(i => { catW = Math.max(catW, ctx.measureText(String(cats[i])).width); });
  catW = Math.min(catW, innerW*0.44);

  /* Stacked bars don't carry per-segment tip labels (they'd collide), so no
     width needs to be reserved for one — the bars get the room instead. */
  ctx.font = '700 ' + (T.szLabel*s) + 'px ' + T.fBody;
  let valW = 0;
  if(!stackAll) vals.forEach(v => { valW = Math.max(valW, ctx.measureText(fmt(v)).width); });

  const anyNeg = mn < 0, anyPos = mx > 0;
  const gutter = T.gap*s*0.9;
  const pL = L + catW + gutter + (anyNeg ? valW + gutter : 0);
  const pR = R - (anyPos ? valW + gutter : 0);
  const X = v => pL + (v-mn)/(mx-mn)*(pR-pL);
  const zero = X(0);

  const ph = pB - pT, rowH = ph/n;
  const nS = stackAll ? 1 : S.length;
  const barH = Math.min(rowH*0.62/nS, T.szLabel*s*2.4);

  if(!stackAll && anyNeg && anyPos){
    ctx.strokeStyle = T.zero; ctx.lineWidth = Math.max(1, s*0.8);
    ctx.beginPath(); ctx.moveTo(zero, pT); ctx.lineTo(zero, pB); ctx.stroke();
  }

  HIT = [];
  order.forEach((origI, i)=>{
    const c = cats[origI];
    const cy = pT + (i+0.5)*rowH;

    ctx.font = '500 ' + (T.szAxis*s) + 'px ' + T.fBody;
    ctx.fillStyle = isHi(c, origI) === false ? T.muted : T.ink;
    ctx.textAlign = 'right';
    let lab = String(c);
    while(ctx.measureText(lab).width > catW && lab.length > 4) lab = lab.slice(0,-2)+'…';
    ctx.fillText(lab, L + catW, cy + T.szAxis*s*0.36);
    ctx.textAlign = 'left';

    if(stackAll){
      const by = cy - barH/2;
      let pos = 0, neg = 0;
      S.forEach((se)=>{
        const v = +se.data[origI]||0;
        const hi = isHi(c, origI);
        const col = emphasise(seriesColor(origIndex(se),se), hi, false);
        const base = v>=0 ? pos : neg;
        if(v>=0) pos+=v; else neg+=v;
        const x0 = X(Math.min(base, base+v)), x1 = X(Math.max(base, base+v));
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.roundRect(x0, by, Math.max(x1-x0,1), barH*0.86, 2*s);
        ctx.fill();
        HIT.push({x:(v<0?x0:x1), y:by+barH*0.43, cx:(x0+x1)/2, cy:by+barH*0.43,
                  v:v, cat:c, key:c, color:col});
      });
    } else {
      S.forEach((se,si)=>{
        const v = +se.data[origI]||0;
        const hi = isHi(c, origI);
        const col = emphasise(seriesColor(origIndex(se),se), hi, false);
        const by = cy - (nS*barH)/2 + si*barH;
        const x0 = Math.min(zero, X(v)), w = Math.max(Math.abs(X(v)-zero), 1);
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.roundRect(x0, by, w, barH*0.86, 2*s);
        ctx.fill();

        ctx.font = '700 ' + (T.szLabel*s) + 'px ' + T.fBody;
        ctx.fillStyle = labelColour(col, hi);
        ctx.textAlign = v < 0 ? 'right' : 'left';
        ctx.fillText(fmt(v), v < 0 ? x0 - gutter : x0 + w + gutter,
                     by + barH*0.43 + T.szLabel*s*0.36);
        ctx.textAlign = 'left';

        HIT.push({x:(v<0?x0:x0+w), y:by+barH*0.43, cx:x0+w/2, cy:by+barH*0.43,
                  v:v, cat:c, key:c, color:col});
      });
    }
  });

  return {pL:pL, pR:pR, pT:pT, pB:pB};
}

/* --------------------------------------------------------------------------
   Panels — several quantities, one shared x-axis, each on its own y-axis,
   stacked in a column. Built for the Milankovitch-cycle case (eccentricity,
   obliquity, precession and insolation all move on the same clock but on
   totally different scales, so one shared y-axis would flatten three of the
   four to a flat line) and for any small dashboard of related indicators.

   Deliberately smaller in scope than the main line/area path: no per-panel
   log axis, no smoothing, no series filter, no click-to-highlight. A reader
   scanning four rows in three seconds needs the shapes and the shared time
   axis, not five more controls. Zooming (the Range control) still works,
   because "what decade am I looking at" is a real editorial choice here too.
   ----------------------------------------------------------------------- */
function drawPanels(ctx, P, L, R, top, bottom){
  const s = P.s;
  const panels = CHART.panels || [];
  const n = panels.length;
  if(!n) return {pL:L, pR:R, pT:top, pB:bottom};

  const xsAll = panels[0].data.map(d => xval(d[0]));
  let idx0 = 0, idx1 = xsAll.length - 1;
  if(VIEW){
    idx0 = Math.max(0, xsAll.findIndex(v => v >= VIEW[0]-1e-9));
    let last = xsAll.length - 1;
    while(last > 0 && xsAll[last] > VIEW[1]+1e-9) last--;
    idx1 = Math.max(idx0+1, last);
    idx1 = Math.min(idx1, xsAll.length-1);
  }
  const hasXMin = CHART.xMin!==null && CHART.xMin!==undefined;
  const hasXMax = CHART.xMax!==null && CHART.xMax!==undefined;
  const xMin = hasXMin ? CHART.xMin : xsAll[idx0];
  const xMax = hasXMax ? CHART.xMax : xsAll[idx1];
  const xSpan = (xMax - xMin) || 1;

  /* Per-panel y domain, ticks and formatter — computed before layout so the
     shared left margin can be sized to the single widest tick label. */
  const rows = panels.map((p,i)=>{
    const F2 = p.format || {};
    const data = p.data.slice(idx0, idx1+1);
    const vals = data.map(d=>+d[1]).filter(v=>!isNaN(v));
    let vMin = (p.yMin!==null && p.yMin!==undefined) ? p.yMin : Math.min.apply(null, vals);
    let vMax = (p.yMax!==null && p.yMax!==undefined) ? p.yMax : Math.max.apply(null, vals);
    if(p.yZero){ vMin = Math.min(vMin,0); vMax = Math.max(vMax,0); }
    if(vMin===vMax){ vMin -= 1; vMax += 1; }
    const padv = (vMax-vMin)*0.12;
    if(!(p.yMin!==null && p.yMin!==undefined) && !p.yZero) vMin -= padv;
    if(!(p.yMax!==null && p.yMax!==undefined)) vMax += padv;
    return { p:p, data:data, vMin:vMin, vMax:vMax,
             tk: ticks(vMin, vMax, 3),
             color: p.color || T.palette[i % T.palette.length] };
  });

  ctx.font = '500 ' + (T.szAxis*s) + 'px ' + T.fBody;
  let yLabW = 0;
  rows.forEach(row => row.tk.forEach(t =>
    { yLabW = Math.max(yLabW, ctx.measureText(fmtWith(t, row.p.format||{})).width); }));

  const pL = L + yLabW + T.gap*s*1.1;
  const pR = R;
  const pw = pR - pL;
  const Xn = v => pL + (v - xMin)/xSpan * pw;

  /* Shared markers — top-level CHART.rules with axis:'x' (or no axis at all,
     since 'x' is the default). A marker is either a point (`at`) or a range
     (`at` and `at2`): a point gets one dashed line spanning every row, a
     range gets two — one at each bound — with no fill between them, since
     the two lines are what read as "this span," not a tint. The label lives
     on the x-axis, not in the plot: a second line of text under the numeric
     ticks, centred on the point (or on the midpoint of a range), the same
     place a reader already looks for "what date is this." A marker with no
     label is just the line(s) — the date without commentary. */
  const xMarkers = (CHART.rules||[]).filter(r => (r.axis||'x') === 'x');
  const hasCaptions = xMarkers.some(r => r.label);
  const captionLH = T.szAxis*s*0.88*1.35;
  const captionRowH = hasCaptions ? captionLH + T.gap*s*0.3 : 0;

  const topPad = T.gap*s*0.9;
  const rowGap = T.gap*s*2.7;
  const xLabelH = CHART.xLabel ? T.szAxis*s*1.7 : 0;
  const xAxisH = T.szAxis*s*1.9 + captionRowH + xLabelH;
  const rowH = (bottom - (top+topPad) - xAxisH - rowGap*(n-1)) / n;

  HIT = [];
  const panelRects = [];

  rows.forEach((row,i)=>{
    const pT = top + topPad + i*(rowH+rowGap);
    const pB = pT + rowH;
    panelRects.push({pT:pT, pB:pB});
    const Y = v => pB - (v-row.vMin)/(row.vMax-row.vMin)*(pB-pT);

    ctx.lineWidth = Math.max(1, s*0.7);
    ctx.font = '500 ' + (T.szAxis*s) + 'px ' + T.fBody;
    ctx.textAlign = 'right';
    row.tk.forEach(t=>{
      const yy = Y(t);
      ctx.strokeStyle = T.grid;
      ctx.beginPath(); ctx.moveTo(pL,yy); ctx.lineTo(pR,yy); ctx.stroke();
      ctx.fillStyle = T.muted;
      ctx.fillText(fmtWith(t, row.p.format||{}), pL - T.gap*s*0.85, yy + T.szAxis*s*0.36);
    });
    ctx.textAlign = 'left';

    (row.p.rules||[]).forEach(r=>{
      if((r.axis||'y') !== 'y') return;
      const yy = Y(r.at);
      ctx.save();
      ctx.strokeStyle = T.zero; ctx.lineWidth = Math.max(1.1, s*0.95);
      ctx.setLineDash([s*5, s*4]);
      ctx.beginPath(); ctx.moveTo(pL,yy); ctx.lineTo(pR,yy); ctx.stroke();
      ctx.setLineDash([]);
      if(r.label){
        ctx.font = '600 ' + (T.szAnno*s*0.9) + 'px ' + T.fBody;
        ctx.fillStyle = T.faint; ctx.textAlign = 'right';
        ctx.fillText(r.label, pR, yy - T.gap*s*0.4);
        ctx.textAlign = 'left';
      }
      ctx.restore();
    });

    const pts = row.data.map(d => [Xn(xval(d[0])), Y(+d[1])]);
    ctx.globalAlpha = .10; ctx.fillStyle = row.color;
    ctx.beginPath(); ctx.moveTo(pts[0][0], pB);
    pts.forEach(pt=>ctx.lineTo(pt[0],pt[1]));
    ctx.lineTo(pts[pts.length-1][0], pB);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;

    ctx.strokeStyle = row.color; ctx.lineWidth = T.lineW*s*0.82;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    pts.forEach((pt,k)=> k ? ctx.lineTo(pt[0],pt[1]) : ctx.moveTo(pt[0],pt[1]));
    ctx.stroke();

    const lastPt = pts[pts.length-1];
    ctx.fillStyle = row.color;
    ctx.beginPath(); ctx.arc(lastPt[0], lastPt[1], T.dotR*s*0.8, 0, 6.284); ctx.fill();

    ctx.font = '700 ' + (T.szLabel*s*0.94) + 'px ' + T.fBody;
    ctx.fillStyle = row.color; ctx.textAlign = 'left';
    ctx.fillText(row.p.label, pL, pT - T.gap*s*0.55);
    ctx.textAlign = 'left';

    row.data.forEach((d,k)=> HIT.push({x:pts[k][0], y:pts[k][1], v:+d[1], cat:d[0],
      key:row.p.label, color:row.color, panel:i}));
  });

  if(xMarkers.length){
    const topY = panelRects[0].pT, botY = panelRects[panelRects.length-1].pB;
    ctx.save();
    ctx.strokeStyle = T.zero;
    ctx.lineWidth = Math.max(1, s*0.85);
    ctx.setLineDash([s*4, s*3.2]);
    xMarkers.forEach(r=>{
      [r.at, (r.at2!=null ? r.at2 : null)].forEach(at=>{
        if(at===null) return;
        const px = Xn(xval(at));
        if(px < pL-0.5 || px > pR+0.5) return;
        ctx.beginPath(); ctx.moveTo(px, topY); ctx.lineTo(px, botY); ctx.stroke();
      });
    });
    ctx.setLineDash([]);
    ctx.restore();
  }

  /* Numeric x ticks: the usual evenly-spaced "nice" positions, unioned with
     every marker's own date(s) — a marker's line needs a labelled tick under
     it even when the auto step would have skipped that exact year. Marker
     ticks win where the two would land close enough to crowd each other (an
     auto tick a couple thousand years from -12,000 reads as visual noise
     once -12,000 already has its own labelled tick right next to it), so an
     auto tick within one caption-width of a marker's is dropped rather than
     drawn alongside it. */
  const uniq = xsAll.slice(idx0, idx1+1);
  ctx.font = '500 ' + (T.szAxis*s) + 'px ' + T.fBody;
  ctx.fillStyle = T.muted;
  const per = ctx.measureText('2020').width*2.9;
  const maxLab = Math.max(2, Math.floor(pw/per));
  const step = Math.max(1, Math.ceil(uniq.length/maxLab));
  const markerXs = [];
  xMarkers.forEach(r=>{
    markerXs.push(xval(r.at));
    if(r.at2!=null) markerXs.push(xval(r.at2));
  });
  const tickSet = new Set(markerXs);
  const minTickGapPx = T.gap*s*4.4;
  const autoTicks = [];
  for(let k=0;k<uniq.length;k+=step) autoTicks.push(uniq[k]);
  autoTicks.push(uniq[uniq.length-1]);
  autoTicks.forEach(v=>{
    if(tickSet.has(v)) return;
    const px = Xn(v);
    if(markerXs.some(mv => Math.abs(Xn(mv)-px) < minTickGapPx)) return;
    tickSet.add(v);
  });
  const picks = Array.from(tickSet).sort((a,b)=>a-b);
  const xLabY = bottom - xLabelH - captionRowH - T.szAxis*s*0.3;
  picks.forEach((v,k)=>{
    const px = Xn(v);
    ctx.textAlign = k===0 ? 'left' : (k===picks.length-1 ? 'right' : 'center');
    ctx.fillText(xlabel(v, xSpan), Math.min(Math.max(px,pL),pR), xLabY);
  });
  ctx.textAlign = 'left';

  /* Marker captions: one more line under the numeric ticks, centred on the
     marker's own date — or, for a range, on the midpoint between its two
     dates, so "Agriculture invented" prints once, not twice at both ends.
     Nudged apart left-to-right when two captions would otherwise overlap
     (the Last Glacial Maximum and the start of agriculture are only 10,000
     years apart on a 100,000-year axis) — same idea as the end-of-line
     labels on a multi-series chart: a few pixels off centre is fine, two
     captions on top of each other is not. */
  if(hasCaptions){
    const capY = bottom - xLabelH - T.gap*s*0.2;
    ctx.font = '500 ' + (T.szAxis*s*0.88) + 'px ' + T.fBody;
    const items = [];
    xMarkers.forEach(r=>{
      if(!r.label) return;
      const pxA = Xn(xval(r.at));
      const cx = r.at2!=null ? (pxA + Xn(xval(r.at2)))/2 : pxA;
      if(cx < pL-2 || cx > pR+2) return;
      items.push({text:r.label, cx:cx, w:ctx.measureText(r.label).width});
    });
    items.sort((a,b)=>a.cx-b.cx);
    const minGap = T.gap*s*1.2;
    for(let i=1;i<items.length;i++){
      const prevRight = items[i-1].cx + items[i-1].w/2;
      const needLeft = items[i].cx - items[i].w/2;
      if(needLeft < prevRight + minGap) items[i].cx += (prevRight + minGap) - needLeft;
    }
    if(items.length){
      const over = (items[items.length-1].cx + items[items.length-1].w/2) - pR;
      if(over > 0) items.forEach(it => { it.cx -= over; });
    }
    ctx.fillStyle = T.faint;
    items.forEach(it=>{
      ctx.textAlign = (it.cx - it.w/2 < pL) ? 'left' : (it.cx + it.w/2 > pR ? 'right' : 'center');
      const drawX = ctx.textAlign==='left' ? pL : (ctx.textAlign==='right' ? pR : it.cx);
      ctx.fillText(it.text, drawX, capY);
    });
    ctx.textAlign = 'left';
  }

  if(CHART.xLabel){
    ctx.font = '600 ' + (T.szAxis*s) + 'px ' + T.fBody;
    ctx.fillStyle = T.muted; ctx.textAlign = 'center';
    ctx.fillText(CHART.xLabel, (pL+pR)/2, bottom - T.szAxis*s*0.1);
    ctx.textAlign = 'left';
  }

  PANEL_GEOM = { pL:pL, pR:pR, rows:panelRects };
  return { pL:pL, pR:pR, pT:top, pB:bottom };
}

/* ==========================================================================
   Screen render, resize, tooltips, export
   ======================================================================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let logoImg = null, geom = null, curW = 0;

/* --------------------------------------------------------------------------
   View modes. The three buttons no longer produce three downloads — they
   change which frame is on screen, live and interactive. Download then takes
   whatever is showing. This removes the old gap where the responsive web
   layout was a fourth, unexported design that nobody ever published.
   ----------------------------------------------------------------------- */
let MODE = 'substack';

/* Desktop opens on the Substack frame, a phone opens on the vertical one,
   because that is the shape each is most likely to be publishing. A coarse
   pointer alone is not enough — tablets and touch laptops are coarse and wide,
   and they want the wide frame. */
function defaultMode(){
  const asked = new URLSearchParams(location.search).get('mode');
  if(asked && PRESETS[asked]) return asked;
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const narrow = Math.min(window.innerWidth, window.innerHeight) <= 820;
  return (coarse && narrow) ? 'vertical' : 'substack';
}

/* Fit the frame to the viewport without ever cropping it. Height is capped as
   well as width, otherwise the 9:16 frame runs off the bottom of a laptop. */
function displayScale(P){
  const stage = document.getElementById('stage');
  const availW = Math.max(200, (stage ? stage.clientWidth : window.innerWidth) - 16);
  const availH = Math.max(240, window.innerHeight * 0.86);
  return Math.min(availW / P.w, availH / P.h);
}

function render(){
  const P = PRESETS[MODE];
  const k = displayScale(P);
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const bs = k * dpr;                     // backing-store scale
  curW = P.w;
  cv.width  = Math.round(P.w * bs);
  cv.height = Math.round(P.h * bs);
  cv.style.width  = Math.round(P.w * k) + 'px';
  cv.style.height = Math.round(P.h * k) + 'px';
  ctx.setTransform(bs, 0, 0, bs, 0, 0);
  geom = draw(ctx, P.w, P.h, P, {logoImg:logoImg});
  /* Line the controls up with the chart rather than with the page: the frames
